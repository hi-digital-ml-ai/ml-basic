format:
  html:
    theme: [cosmo, styles.scss]
    page-layout: full
    grid:
      sidebar-width: 300px
      body-width: 1250px
      margin-width: 250px
      gutter-width: 1.6rem
    toc: true
    toc-depth: 3          # 2 trips a Quarto 1.9.38 bug: the list renders
    toc-title: "On this page"   # as <ul class="collapse"> and never unhides.
    code-copy: true
    code-overflow: wrap
    code-link: true
    fig-align: center
    df-print: kable

# Adds the "Code from this page" line to every page that has code.
filters:
  - tools/code-downloads.lua

execute:
  freeze: auto
  warning: false
  message: false

knitr:
  opts_chunk:
    dev: png
    dpi: 200
    fig-width: 7
    fig-height: 4.5
    comment: "#>"
