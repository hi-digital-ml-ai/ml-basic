project:
  type: website
  output-dir: _site

website:
  title: "ML Basics for Marine Science"
  description: "A plain-English introduction to machine learning for marine researchers, with worked tidymodels examples."
  site-url: https://hi-digital-ml-ai.github.io/ml-basic/
  repo-url: https://github.com/hi-digital-ml-ai/ml-basic
  search: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: chapters/index.qmd
        text: Course
      - href: contributed/index.qmd
        text: Contributed
  sidebar:
    style: floating
    collapse-level: 1
    contents:
      - href: index.qmd
        text: Welcome
      - section: "Course sections"
        contents:
          - section: "1 · Introduction"
            href: chapters/01-introduction/index.qmd
            contents:
              - href: chapters/01-introduction/what-is-machine-learning.qmd
                text: "What machine learning is"
              - href: chapters/01-introduction/applications-in-marine-science.qmd
                text: "Where it is already used"
              - href: chapters/01-introduction/types-of-learning.qmd
                text: "The main types of learning"
              - href: chapters/01-introduction/prediction-and-explanation.qmd
                text: "Prediction versus explanation"
          - section: "2 · Marine datasets"
            href: chapters/02-marine-data/index.qmd
            contents:
              - href: chapters/02-marine-data/observations-and-features.qmd
                text: "What one row is"
              - href: chapters/02-marine-data/marine-data-types.qmd
                text: "Kinds of marine data"
              - href: chapters/02-marine-data/exploratory-analysis.qmd
                text: "Looking before modelling"
              - href: chapters/02-marine-data/missing-values-and-outliers.qmd
                text: "Missing values, outliers and imbalance"
              - href: chapters/02-marine-data/scaling-and-encoding.qmd
                text: "Scaling, transforming and encoding"
              - href: chapters/02-marine-data/splitting-data.qmd
                text: "Training, validation and test data"
              - href: chapters/02-marine-data/information-leakage.qmd
                text: "Avoiding information leakage"
          - section: "3 · Supervised learning"
            href: chapters/03-supervised-learning/index.qmd
            contents:
              - href: chapters/03-supervised-learning/regression-and-classification.qmd
                text: "Regression or classification?"
              - href: chapters/03-supervised-learning/linear-and-polynomial-regression.qmd
                text: "Linear, polynomial and count regression"
              - href: chapters/03-supervised-learning/logistic-regression.qmd
                text: "Logistic regression"
              - href: chapters/03-supervised-learning/trees-forests-boosting.qmd
                text: "Trees, forests and boosting"
              - href: chapters/03-supervised-learning/choosing-a-method.qmd
                text: "Choosing a method"
          - section: "4 · How algorithms learn"
            href: chapters/04-how-algorithms-learn/index.qmd
            contents:
              - href: chapters/04-how-algorithms-learn/loss-functions.qmd
                text: "Loss and objective functions"
              - href: chapters/04-how-algorithms-learn/parameter-estimation.qmd
                text: "Parameter estimation"
              - href: chapters/04-how-algorithms-learn/gradient-descent.qmd
                text: "Gradient descent"
              - href: chapters/04-how-algorithms-learn/maximum-likelihood.qmd
                text: "Maximum likelihood"
              - href: chapters/04-how-algorithms-learn/map-and-priors.qmd
                text: "MAP estimation and priors"
              - href: chapters/04-how-algorithms-learn/reading-a-fit.qmd
                text: "Reading a fit"
          - href: chapters/05-generalisation/index.qmd
            text: "5 · Generalisation"
          - href: chapters/06-assumptions-limitations/index.qmd
            text: "6 · Assumptions & limitations"
          - href: chapters/07-validation/index.qmd
            text: "7 · Validation"
          - href: chapters/08-unsupervised-learning/index.qmd
            text: "8 · Unsupervised learning"
          - href: chapters/09-neural-networks/index.qmd
            text: "9 · Neural networks"
          - href: chapters/10-interpretation/index.qmd
            text: "10 · Interpretation & responsible use"
      - section: "More"
        contents:
          - href: chapters/index.qmd
            text: All pages
          - href: contributed/index.qmd
            text: Contributed pages
  page-footer:
    left: "Machine Learning Basics for Marine Science"
    right: "Built with [Quarto](https://quarto.org) and [tidymodels](https://www.tidymodels.org)"

format:
  html:
    theme: [cosmo, styles.scss]
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    code-link: true
    fig-align: center
    df-print: kable

execute:
  freeze: auto
  warning: false
  message: false

knitr:
  opts_chunk:
    dev: png
    dpi: 200
    fig-width: 7
    fig-height: 4.5
    comment: "#>"
