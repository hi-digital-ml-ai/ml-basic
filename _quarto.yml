project:
  type: website
  output-dir: _site
  # Pulls the R and Python out of every page into runnable scripts and zips them,
  # so the downloads cannot drift from the pages they came from. It runs *before*
  # the pages so the links to it resolve. See tools/README.md.
  pre-render:
    - tools/extract-code.py
  resources:
    - downloads/

