<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 244" width="100%" role="img" aria-label="A scikit-learn Pipeline drawn as nested objects: a ColumnTransformer holding one transformer per group of columns, followed by the estimator, with fit and predict called on the outside">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a949c"/>
    </marker>
    <style>
      .outer { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.8; rx: 10; }
      .mid   { fill: #ffffff; stroke: #1b6a87; stroke-width: 1.4; rx: 8; }
      .inner { fill: #f6f8fa; stroke: #b9c4cb; stroke-width: 1.2; rx: 6; }
      .fn    { font: bold 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1b6a87; }
      .head  { font: bold 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body  { font: 13px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .cols  { font: 12px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #8a949c; }
      .link  { stroke: #8a949c; stroke-width: 1.8; fill: none; }
    </style>
  </defs>

  <rect class="outer" x="150" y="14" width="640" height="216"/>
  <text class="fn" x="170" y="40">Pipeline</text>

  <rect class="mid" x="172" y="54" width="360" height="156"/>
  <text class="fn" x="188" y="80">ColumnTransformer</text>

  <rect class="inner" x="190" y="96" width="324" height="46"/>
  <text class="body" x="204" y="116">SimpleImputer(strategy="median")</text>
  <text class="cols" x="204" y="134">depth_m, temperature_c, chlorophyll_mg_m3</text>

  <rect class="inner" x="190" y="152" width="324" height="46"/>
  <text class="body" x="204" y="172">OneHotEncoder(drop="first")</text>
  <text class="cols" x="204" y="190">substrate</text>

  <rect class="mid" x="576" y="98" width="196" height="68"/>
  <text class="fn"   x="592" y="126">LogisticRegression</text>
  <text class="body" x="592" y="148">The estimator.</text>

  <line class="link" x1="532" y1="132" x2="572" y2="132" marker-end="url(#arrow2)"/>

  <text class="fn"   x="10" y="112">pipe.fit(</text>
  <text class="fn"   x="10" y="132">  X_train, y_train)</text>
  <line class="link" x1="132" y1="122" x2="146" y2="122" marker-end="url(#arrow2)"/>

  <text class="fn"   x="810" y="122">pipe.predict(</text>
  <text class="fn"   x="810" y="142">  X_test)</text>
  <line class="link" x1="792" y1="122" x2="806" y2="122" marker-end="url(#arrow2)"/>

</svg>
