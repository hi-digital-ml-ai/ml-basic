<rect class="box" x="8" y="8" width="302" height="314" rx="8"/>
<text class="head" x="24" y="36">Supervised</text>
<text class="body" x="24" y="286">Every example has an answer;</text><text class="body" x="24" y="304">the model learns to predict it.</text>
<rect class="box" x="320" y="8" width="302" height="314" rx="8"/>
<text class="head" x="336" y="36">Unsupervised</text>
<text class="body" x="336" y="286">No answers; the method looks</text><text class="body" x="336" y="304">for groups in the measurements.</text>
<rect class="box" x="632" y="8" width="302" height="314" rx="8"/>
<text class="head" x="648" y="36">Reinforcement</text>
<text class="body" x="648" y="286">It learns by acting and being</text><text class="body" x="648" y="304">rewarded. Not in this course.</text>
