<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="100%" role="img" aria-label="Three panels. Supervised learning: a table of measurements with an answer column. Unsupervised learning: unlabelled points falling into three groups. Reinforcement learning: an underwater vehicle acting on the sea and receiving a reward in a loop.">
<defs><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a949c"/></marker><style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .head { font: bold 16px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 14px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .note { font: italic 13px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .axis { stroke: #8a949c; stroke-width: 1.2; }
      .alab { font: 12px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #77818a; }
      .yes  { fill: #0072B2; }
      .no   { fill: #E69F00; }
      .grey { fill: #5A5A5A; opacity: 0.75; }
      .cell { font: 13px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .ans  { font: bold 13px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #D55E00; }
