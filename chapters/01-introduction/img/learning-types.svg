<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 466" width="100%" role="img" aria-label="Three kinds of learning. Supervised learning: a table of measurements with an answer column. Unsupervised learning: unlabelled points falling into three groups. Reinforcement learning: an underwater vehicle acting on the sea and receiving a reward in a loop.">
<defs><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a949c"/></marker><style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #77818a; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .axis { stroke: #8a949c; stroke-width: 1.2; }
      .alab { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #77818a; }
      .yes  { fill: #0072B2; }
      .no   { fill: #E69F00; }
      .grey { fill: #5A5A5A; opacity: 0.75; }
      .cell { font: 16px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .ans  { font: bold 16px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #D55E00; }
    </style></defs>
<text class="title" x="470" y="26" text-anchor="middle">Three kinds of learning</text>
<rect class="box" x="8" y="48" width="300" height="380" rx="8"/>
<rect x="8" y="48" width="300" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="26" y="86">Supervised</text>
<text class="lab" x="26" y="110">REGRESSION, CLASSIFICATION</text>
<text class="body" x="26" y="388">Every example has an answer;</text>
<text class="body" x="26" y="410">the model learns to predict it.</text>
<rect class="box" x="320" y="48" width="300" height="380" rx="8"/>
<rect x="320" y="48" width="300" height="6" rx="3" fill="#009E73"/>
<text class="head" x="338" y="86">Unsupervised</text>
<text class="lab" x="338" y="110">CLUSTERING</text>
<text class="body" x="338" y="388">No answers; the method looks</text>
<text class="body" x="338" y="410">for groups in the measurements.</text>
<rect class="box" x="632" y="48" width="300" height="380" rx="8"/>
<rect x="632" y="48" width="300" height="6" rx="3" fill="#8a949c"/>
<text class="head" x="650" y="86">Reinforcement</text>
<text class="lab" x="650" y="110">NOT IN THIS COURSE</text>
<text class="body" x="650" y="388">It learns by acting and</text>
<text class="body" x="650" y="410">being rewarded.</text>
<rect x="224" y="126" width="68" height="160" fill="#D55E00" fill-opacity="0.08" rx="4"/>
<text class="cell" x="26" y="148" font-weight="bold">Temp</text>
<text class="cell" x="90" y="148" font-weight="bold">Salinity</text>
<text class="cell" x="168" y="148" font-weight="bold">Depth</text>
<text class="ans" x="232" y="148">Found?</text>
