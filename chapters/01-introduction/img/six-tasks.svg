<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 668" width="100%" role="img" aria-label="Six tasks that cover most machine-learning applications in marine science, each with a small sketch: naming things in images and sound, mapping across space, filling gaps in measurements, forecasting, finding groups without labels, and standing in for a slow model.">
