<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 420" width="100%" role="img" aria-label="The four-step pipeline shared by supervised applications: plentiful data, scarce specialist labels, a model that learns the link, and use at scale on unlabelled data.">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a949c"/></marker>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .num  { font: bold 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #ffffff; }
      .note { font: italic 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .cost { font: bold 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #D55E00; }
      .good { font: bold 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #009E73; }
    </style>
</defs>

<text class="title" x="470" y="26" text-anchor="middle">From a few labels to predictions at scale</text>

<!-- Four steps -->
<rect class="box" x="8"   y="48" width="210" height="236" rx="8"/>
<rect class="box" x="246" y="48" width="210" height="236" rx="8"/>
<rect class="box" x="484" y="48" width="210" height="236" rx="8"/>
<rect class="box" x="722" y="48" width="210" height="236" rx="8"/>

<circle cx="38"  cy="80" r="15" fill="#1b6a87"/><text class="num" x="38"  y="86" text-anchor="middle">1</text>
<circle cx="276" cy="80" r="15" fill="#1b6a87"/><text class="num" x="276" y="86" text-anchor="middle">2</text>
<circle cx="514" cy="80" r="15" fill="#1b6a87"/><text class="num" x="514" y="86" text-anchor="middle">3</text>
<circle cx="752" cy="80" r="15" fill="#1b6a87"/><text class="num" x="752" y="86" text-anchor="middle">4</text>

<text class="head" x="62"  y="87">Data you have</text>
<text class="body" x="24"  y="126">Images, recordings,</text>
<text class="body" x="24"  y="150">sensor casts and</text>
<text class="body" x="24"  y="174">satellite fields</text>
<text class="good" x="24"  y="262">Plentiful</text>

<text class="head" x="300" y="87">Expert labels</text>
<text class="body" x="262" y="126">A specialist names</text>
<text class="body" x="262" y="150">the species or the</text>
<text class="body" x="262" y="174">call in a small share</text>
<text class="body" x="262" y="198">of the data</text>
<text class="cost" x="262" y="262">Slow and costly</text>

<text class="head" x="538" y="87">Model learns</text>
<text class="body" x="500" y="126">It learns the link</text>
<text class="body" x="500" y="150">from data to label,</text>
<text class="body" x="500" y="174">using whatever</text>
<text class="body" x="500" y="198">predicts the label</text>
<text class="note" x="500" y="262">Fast once labelled</text>

<text class="head" x="776" y="87">Used at scale</text>
<text class="body" x="738" y="126">Run on all the</text>
<text class="body" x="738" y="150">unlabelled data and</text>
<text class="body" x="738" y="174">on next year's survey</text>
<text class="cost" x="738" y="214">Valid only where</text>
<text class="cost" x="738" y="238">new data resemble</text>
<text class="cost" x="738" y="262">the labelled data</text>

<line x1="220" y1="166" x2="242" y2="166" stroke="#8a949c" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="458" y1="166" x2="480" y2="166" stroke="#8a949c" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="696" y1="166" x2="718" y2="166" stroke="#8a949c" stroke-width="1.8" marker-end="url(#arrow)"/>

<!-- Note -->
<rect x="8" y="304" width="924" height="68" rx="8" fill="#ffffff" stroke="#8a949c" stroke-width="1.2" stroke-dasharray="5 4"/>
<text class="head" x="470" y="332" text-anchor="middle">The value is in step 4; the risk is in step 2</text>
<text class="body" x="470" y="358" text-anchor="middle">Whatever the labelled examples over- or under-represent, the model carries into everything else</text>
</svg>
