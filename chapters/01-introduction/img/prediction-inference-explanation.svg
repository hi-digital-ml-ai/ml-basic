<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 708" width="100%" role="img" aria-label="Prediction, inference and explanation compared. One fitted model can serve three aims. Prediction gives a value for a new case and is checked on held-back cases. Inference gives an estimate with an interval and rests on the model's assumptions. Explanation makes a claim about cause and rests on study design and subject knowledge. Each aim asks more of the model and is harder to check.">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55606a"/></marker>
  <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker>
  <linearGradient id="aims" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#E69F00"/><stop offset="0.5" stop-color="#0072B2"/><stop offset="1" stop-color="#009E73"/></linearGradient>
  <style>
    .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
    .node { fill: #ffffff; stroke: #1b6a87; stroke-width: 1.4; }
    .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
    .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
    .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
    .top  { font: 19px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
    .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #77818a; letter-spacing: 0.5px; }
    .small{ font: 16px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
    .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
    .rule { stroke: #d5dde2; stroke-width: 1; }
    .axis { stroke: #8a949c; stroke-width: 1.2; }
    .link { stroke: #55606a; stroke-width: 1.5; fill: none; }
  </style>
</defs>

<text class="title" x="470" y="30" text-anchor="middle">One fitted model, three aims</text>

<!-- The shared model feeding the three aims -->
<rect class="node" x="270" y="46" width="400" height="42" rx="8"/>
<text class="top" x="470" y="73" text-anchor="middle">One model fitted to the data</text>
<path class="link" d="M470,88 V102 M156,102 H784"/>
<path class="link" d="M156,102 V122" marker-end="url(#arrow)"/>
<path class="link" d="M470,102 V122" marker-end="url(#arrow)"/>
<path class="link" d="M784,102 V122" marker-end="url(#arrow)"/>

<!-- Prediction -->
<rect class="box" x="8" y="124" width="296" height="458" rx="8"/>
<rect x="8" y="124" width="296" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="28" y="160">Prediction</text>
<text class="lab" x="28" y="330">QUESTION</text>
<text class="body" x="28" y="354">The outcome for a case</text>
<text class="body" x="28" y="378">the model has not seen</text>
<line class="rule" x1="28" y1="396" x2="284" y2="396"/>
<text class="lab" x="28" y="422">ANSWER</text>
<text class="body" x="28" y="446">A value for each</text>
<text class="body" x="28" y="470">new case</text>
<line class="rule" x1="28" y1="488" x2="284" y2="488"/>
<text class="lab" x="28" y="514">CHECKED BY</text>
<text class="body" x="28" y="538">The error on cases</text>
<text class="body" x="28" y="562">held back from fitting</text>
<line class="axis" x1="36" y1="270" x2="276" y2="270"/>
<g fill="#8a949c" fill-opacity="0.6"><circle cx="58" cy="253" r="3.5"/><circle cx="76" cy="232" r="3.5"/><circle cx="94" cy="241" r="3.5"/><circle cx="111" cy="205" r="3.5"/><circle cx="128" cy="220" r="3.5"/><circle cx="146" cy="188" r="3.5"/><circle cx="164" cy="210" r="3.5"/><circle cx="181" cy="198" r="3.5"/><circle cx="244" cy="246" r="3.5"/><circle cx="258" cy="234" r="3.5"/></g>
<path d="M46,258 Q146,155 266,253" fill="none" stroke="#E69F00" stroke-width="2.6"/>
<line x1="211" y1="270" x2="211" y2="226" stroke="#E69F00" stroke-width="1.4" stroke-dasharray="4 3"/>
<circle cx="211" cy="218" r="7" fill="#E69F00" stroke="#ffffff" stroke-width="1.5"/>
<text class="small" x="211" y="296" text-anchor="middle">a new case</text>

<!-- Inference -->
<rect class="box" x="322" y="124" width="296" height="458" rx="8"/>
<rect x="322" y="124" width="296" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="342" y="160">Inference</text>
<text class="lab" x="342" y="330">QUESTION</text>
<text class="body" x="342" y="354">The size of a relationship</text>
<text class="body" x="342" y="378">and how sure we can be</text>
<line class="rule" x1="342" y1="396" x2="598" y2="396"/>
<text class="lab" x="342" y="422">ANSWER</text>
<text class="body" x="342" y="446">An estimate with an</text>
<text class="body" x="342" y="470">interval or a p-value</text>
<line class="rule" x1="342" y1="488" x2="598" y2="488"/>
<text class="lab" x="342" y="514">CHECKED BY</text>
<text class="body" x="342" y="538">The model's assumptions,</text>
<text class="body" x="342" y="562">such as independent errors</text>
<line class="axis" x1="350" y1="270" x2="590" y2="270"/>
<line x1="540" y1="190" x2="540" y2="270" stroke="#8a949c" stroke-width="1.2" stroke-dasharray="4 3"/>
<text class="small" x="540" y="184" text-anchor="middle">0</text>
<line x1="390" y1="232" x2="485" y2="232" stroke="#0072B2" stroke-width="2.6"/>
<line x1="390" y1="223" x2="390" y2="241" stroke="#0072B2" stroke-width="2.6"/>
<line x1="485" y1="223" x2="485" y2="241" stroke="#0072B2" stroke-width="2.6"/>
<circle cx="435" cy="232" r="7" fill="#0072B2"/>
<text class="small" x="438" y="210" text-anchor="middle">estimate and interval</text>
<text class="small" x="470" y="296" text-anchor="middle">the interval misses zero</text>

<!-- Explanation -->
<rect class="box" x="636" y="124" width="296" height="458" rx="8"/>
<rect x="636" y="124" width="296" height="6" rx="3" fill="#009E73"/>
<text class="head" x="656" y="160">Explanation</text>
<text class="lab" x="656" y="330">QUESTION</text>
<text class="body" x="656" y="354">Does changing a driver</text>
<text class="body" x="656" y="378">change the outcome?</text>
<line class="rule" x1="656" y1="396" x2="912" y2="396"/>
<text class="lab" x="656" y="422">ANSWER</text>
<text class="body" x="656" y="446">A claim about cause</text>
<text class="body" x="656" y="470">and effect</text>
<line class="rule" x1="656" y1="488" x2="912" y2="488"/>
<text class="lab" x="656" y="514">CHECKED BY</text>
<text class="body" x="656" y="538">Study design and subject</text>
<text class="body" x="656" y="562">knowledge, not data alone</text>
<rect class="node" x="739" y="180" width="90" height="32" rx="6"/>
<text class="small" x="784" y="201" text-anchor="middle">Depth</text>
<rect class="node" x="650" y="244" width="100" height="32" rx="6"/>
<text class="small" x="700" y="265" text-anchor="middle">Salinity</text>
<rect class="node" x="818" y="244" width="100" height="32" rx="6"/>
<text class="small" x="868" y="265" text-anchor="middle">Outcome</text>
<line x1="764" y1="212" x2="716" y2="241" stroke="#009E73" stroke-width="1.8" marker-end="url(#arrow-end)"/>
<line x1="804" y1="212" x2="852" y2="241" stroke="#009E73" stroke-width="1.8" marker-end="url(#arrow-end)"/>
<line x1="752" y1="260" x2="816" y2="260" stroke="#8a949c" stroke-width="1.5" stroke-dasharray="3 3"/>
<path d="M775,253 L787,267 M787,253 L775,267" stroke="#D55E00" stroke-width="2.2"/>
<text class="small" x="784" y="296" text-anchor="middle">salinity travels with depth</text>

<!-- The direction across the three -->
<text class="note" x="470" y="618" text-anchor="middle">From left to right, each aim asks more of the model and is harder to check</text>
<rect x="40" y="634" width="836" height="10" rx="5" fill="url(#aims)"/>
<path d="M876,628 L898,639 L876,650 z" fill="#009E73"/>
</svg>
