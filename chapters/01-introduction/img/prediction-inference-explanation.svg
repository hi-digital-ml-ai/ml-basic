<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 596" width="100%" role="img" aria-label="Prediction, inference and explanation compared. One fitted model can serve three aims. Prediction gives a number for a new station and is checked on held-back stations. Inference gives an estimate with an interval and rests on the model's assumptions. Explanation makes a claim about cause and rests on study design and subject knowledge. Each aim asks more of the model and is harder to check.">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55606a"/></marker>
  <marker id="arrow-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#009E73"/></marker>
  <linearGradient id="aims" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#E69F00"/><stop offset="0.5" stop-color="#0072B2"/><stop offset="1" stop-color="#009E73"/></linearGradient>
  <style>
    .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
    .node { fill: #ffffff; stroke: #1b6a87; stroke-width: 1.4; }
    .title{ font: bold 20px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
    .head { font: bold 20px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
    .body { font: 16px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
    .top  { font: 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
    .lab  { font: bold 13px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #77818a; letter-spacing: 0.5px; }
    .small{ font: 14px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
    .note { font: italic 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
    .rule { stroke: #d5dde2; stroke-width: 1; }
    .axis { stroke: #8a949c; stroke-width: 1.2; }
    .link { stroke: #55606a; stroke-width: 1.5; fill: none; }
  </style>
</defs>

<text class="title" x="380" y="26" text-anchor="middle">One fitted model, three aims</text>

<!-- The shared model feeding the three aims -->
<rect class="node" x="210" y="42" width="340" height="40" rx="8"/>
<text class="top" x="380" y="68" text-anchor="middle">A model fitted to the surveyed stations</text>
<path class="link" d="M380,82 V96 M126,96 H634"/>
<path class="link" d="M126,96 V114" marker-end="url(#arrow)"/>
<path class="link" d="M380,96 V114" marker-end="url(#arrow)"/>
<path class="link" d="M634,96 V114" marker-end="url(#arrow)"/>

<!-- Prediction -->
<rect class="box" x="8" y="116" width="236" height="404" rx="8"/>
<rect x="8" y="116" width="236" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="26" y="150">Prediction</text>
<line class="axis" x1="30" y1="246" x2="222" y2="246"/>
<g fill="#8a949c" fill-opacity="0.6">
  <circle cx="48" cy="232" r="3"/><circle cx="62" cy="214" r="3"/><circle cx="76" cy="222" r="3"/>
  <circle cx="90" cy="192" r="3"/><circle cx="104" cy="204" r="3"/><circle cx="118" cy="178" r="3"/>
  <circle cx="132" cy="196" r="3"/><circle cx="146" cy="186" r="3"/><circle cx="196" cy="226" r="3"/>
  <circle cx="208" cy="216" r="3"/>
</g>
<path d="M38,236 Q118,150 214,232" fill="none" stroke="#E69F00" stroke-width="2.4"/>
<line x1="170" y1="246" x2="170" y2="209" stroke="#E69F00" stroke-width="1.4" stroke-dasharray="4 3"/>
<circle cx="170" cy="203" r="6" fill="#E69F00" stroke="#ffffff" stroke-width="1.5"/>
<text class="small" x="170" y="264" text-anchor="middle">a new station</text>

<text class="lab" x="26" y="292">QUESTION</text>
<text class="body" x="26" y="314">The count at a station</text>
<text class="body" x="26" y="336">not yet sampled</text>
<line class="rule" x1="26" y1="352" x2="226" y2="352"/>
<text class="lab" x="26" y="376">ANSWER</text>
<text class="body" x="26" y="398">A number for each</text>
<text class="body" x="26" y="420">new station</text>
<line class="rule" x1="26" y1="436" x2="226" y2="436"/>
<text class="lab" x="26" y="460">CHECKED BY</text>
<text class="body" x="26" y="482">The error on stations</text>
<text class="body" x="26" y="504">held back from fitting</text>

<!-- Inference -->
<rect class="box" x="262" y="116" width="236" height="404" rx="8"/>
<rect x="262" y="116" width="236" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="280" y="150">Inference</text>
<line class="axis" x1="284" y1="236" x2="476" y2="236"/>
<line x1="436" y1="170" x2="436" y2="236" stroke="#8a949c" stroke-width="1.2" stroke-dasharray="4 3"/>
<text class="small" x="436" y="252" text-anchor="middle">0</text>
<line x1="316" y1="204" x2="392" y2="204" stroke="#0072B2" stroke-width="2.4"/>
<line x1="316" y1="196" x2="316" y2="212" stroke="#0072B2" stroke-width="2.4"/>
<line x1="392" y1="196" x2="392" y2="212" stroke="#0072B2" stroke-width="2.4"/>
<circle cx="352" cy="204" r="6" fill="#0072B2"/>
<text class="small" x="354" y="184" text-anchor="middle">estimate and interval</text>
<text class="small" x="380" y="266" text-anchor="middle">the interval misses zero</text>

<text class="lab" x="280" y="292">QUESTION</text>
<text class="body" x="280" y="314">The size of a relationship</text>
<text class="body" x="280" y="336">and how sure we can be</text>
<line class="rule" x1="280" y1="352" x2="480" y2="352"/>
<text class="lab" x="280" y="376">ANSWER</text>
<text class="body" x="280" y="398">An estimate with an</text>
<text class="body" x="280" y="420">interval or a p-value</text>
<line class="rule" x1="280" y1="436" x2="480" y2="436"/>
<text class="lab" x="280" y="460">CHECKED BY</text>
<text class="body" x="280" y="482">The model's assumptions,</text>
<text class="body" x="280" y="504">such as independent errors</text>

<!-- Explanation -->
<rect class="box" x="516" y="116" width="236" height="404" rx="8"/>
<rect x="516" y="116" width="236" height="6" rx="3" fill="#009E73"/>
<text class="head" x="534" y="150">Explanation</text>
<rect class="node" x="594" y="164" width="80" height="28" rx="6"/>
<text class="small" x="634" y="183" text-anchor="middle">Depth</text>
<rect class="node" x="526" y="222" width="84" height="28" rx="6"/>
<text class="small" x="568" y="241" text-anchor="middle">Salinity</text>
<rect class="node" x="648" y="222" width="94" height="28" rx="6"/>
<text class="small" x="695" y="241" text-anchor="middle">Abundance</text>
<line x1="614" y1="192" x2="584" y2="219" stroke="#009E73" stroke-width="1.8" marker-end="url(#arrow-end)"/>
<line x1="654" y1="192" x2="684" y2="219" stroke="#009E73" stroke-width="1.8" marker-end="url(#arrow-end)"/>
<line x1="612" y1="236" x2="646" y2="236" stroke="#8a949c" stroke-width="1.5" stroke-dasharray="3 3"/>
<path d="M624,230 L634,242 M634,230 L624,242" stroke="#D55E00" stroke-width="2"/>
<text class="small" x="634" y="266" text-anchor="middle">salinity travels with depth</text>

<text class="lab" x="534" y="292">QUESTION</text>
<text class="body" x="534" y="314">Does changing a driver</text>
<text class="body" x="534" y="336">change the count?</text>
<line class="rule" x1="534" y1="352" x2="734" y2="352"/>
<text class="lab" x="534" y="376">ANSWER</text>
<text class="body" x="534" y="398">A claim about cause</text>
<text class="body" x="534" y="420">and effect</text>
<line class="rule" x1="534" y1="436" x2="734" y2="436"/>
<text class="lab" x="534" y="460">CHECKED BY</text>
<text class="body" x="534" y="482">Study design and subject</text>
<text class="body" x="534" y="504">knowledge, not data alone</text>

<!-- The direction across the three -->
<text class="note" x="380" y="554" text-anchor="middle">From left to right, each aim asks more of the model and is harder to check</text>
<rect x="40" y="570" width="660" height="10" rx="5" fill="url(#aims)"/>
<path d="M700,564 L720,575 L700,586 z" fill="#009E73"/>
</svg>
