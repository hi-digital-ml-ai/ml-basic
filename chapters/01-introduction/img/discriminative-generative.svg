<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 552" width="100%" role="img" aria-label="Two panels with the same two groups of points. On the left a discriminative model draws a boundary between them; on the right a generative model draws an outline around each group and adds a new example.">
