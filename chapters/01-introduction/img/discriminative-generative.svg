    </style></defs>
<text class="title" x="470" y="26" text-anchor="middle">Two things a model can learn</text>
<rect class="box" x="8" y="48" width="456" height="432" rx="8"/>
<rect x="8" y="48" width="456" height="6" rx="3" fill="#009E73"/>
<text class="head" x="26" y="86">Discriminative</text>
<text class="lab" x="26" y="110">LEARNS THE BOUNDARY</text>
<text class="body" x="26" y="440">It draws the line between the groups,</text>
<text class="body" x="26" y="462">and nothing else.</text>
<rect class="box" x="476" y="48" width="456" height="432" rx="8"/>
<rect x="476" y="48" width="456" height="6" rx="3" fill="#CC79A7"/>
<text class="head" x="494" y="86">Generative</text>
<text class="lab" x="494" y="110">LEARNS EACH GROUP</text>
<text class="body" x="494" y="440">It describes each group, so it can also</text>
<text class="body" x="494" y="462">generate new, plausible examples.</text>
