<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 614" width="100%" role="img" aria-label="Statistical modelling and machine learning compared. A scale of methods runs from forms you write yourself to forms the algorithm finds, with linear regression, GLMs and GAMs used by both. Below, a band lists what the two share, and two columns contrast their aim, result, check and risk.">
<defs><linearGradient id="scale" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#0072B2"/><stop offset="1" stop-color="#E69F00"/></linearGradient><style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 20px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 20px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #77818a; letter-spacing: 0.5px; }
      .note { font: italic 16px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .meth { font: 16px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .tick { stroke: #1f2933; stroke-width: 1.5; }
      .rule { stroke: #d5dde2; stroke-width: 1; }
    </style></defs>

<!-- The scale of methods: labels alternate above and below the bar -->
<text class="title" x="380" y="26" text-anchor="middle">Who chooses the shape of the relationship?</text>
<rect x="200" y="44" width="264" height="88" rx="8" fill="#1b6a87" fill-opacity="0.09"/>
<rect x="40" y="80" width="680" height="12" rx="6" fill="url(#scale)"/>
<line class="tick" x1="80"  y1="72" x2="80"  y2="100"/><text class="meth" x="80"  y="66" text-anchor="middle">t-test</text>
<line class="tick" x1="165" y1="72" x2="165" y2="100"/><text class="meth" x="165" y="120" text-anchor="middle">ANOVA</text>
<line class="tick" x1="270" y1="72" x2="270" y2="100"/><text class="meth" x="270" y="66" text-anchor="middle">Linear regression</text>
<line class="tick" x1="345" y1="72" x2="345" y2="100"/><text class="meth" x="345" y="120" text-anchor="middle">GLM</text>
<line class="tick" x1="415" y1="72" x2="415" y2="100"/><text class="meth" x="415" y="66" text-anchor="middle">GAM</text>
<line class="tick" x1="528" y1="72" x2="528" y2="100"/><text class="meth" x="528" y="120" text-anchor="middle">Decision tree</text>
<line class="tick" x1="590" y1="72" x2="590" y2="100"/><text class="meth" x="590" y="66" text-anchor="middle">Random forest</text>
<line class="tick" x1="676" y1="72" x2="676" y2="100"/><text class="meth" x="676" y="120" text-anchor="middle">Neural network</text>
<text class="note" x="40" y="152">← You write it down</text>
<text class="note" x="335" y="152" text-anchor="middle">used by both</text>
<text class="note" x="720" y="152" text-anchor="end">The algorithm finds it →</text>

<!-- What both share -->
<rect x="8" y="168" width="744" height="62" rx="8" fill="#ffffff" stroke="#8a949c" stroke-width="1.2" stroke-dasharray="5 4"/>
<text class="lab" x="380" y="192" text-anchor="middle">SHARED BY BOTH</text>
<text class="body" x="380" y="216" text-anchor="middle">Data with measurements · a model with parameters · fitting by making the error small</text>

<!-- The two columns -->
<rect class="box" x="8" y="244" width="366" height="362" rx="8"/>
<rect x="8" y="244" width="366" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="26" y="280">Statistical modelling</text>
<text class="lab" x="26" y="312">AIM</text>
<text class="body" x="26" y="334">Explain: estimate an effect,</text>
<text class="body" x="26" y="356">such as abundance per degree</text>
<line class="rule" x1="26" y1="372" x2="356" y2="372"/>
<text class="lab" x="26" y="396">RESULT</text>
<text class="body" x="26" y="418">A few numbers, each with an</text>
<text class="body" x="26" y="440">interval, that go into a paper</text>
<line class="rule" x1="26" y1="456" x2="356" y2="456"/>
<text class="lab" x="26" y="480">CHECKED BY</text>
<text class="body" x="26" y="502">The assumptions: residual plots,</text>
<text class="body" x="26" y="524">the distribution of errors</text>
<line class="rule" x1="26" y1="540" x2="356" y2="540"/>
<text class="lab" x="26" y="564">RISK</text>
<text class="body" x="26" y="586">A wrong shape gives a wrong effect</text>

<rect class="box" x="386" y="244" width="366" height="362" rx="8"/>
<rect x="386" y="244" width="366" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="404" y="280">Machine learning</text>
<text class="lab" x="404" y="312">AIM</text>
<text class="body" x="404" y="334">Predict: give good answers for</text>
<text class="body" x="404" y="356">stations not yet sampled</text>
<line class="rule" x1="404" y1="372" x2="734" y2="372"/>
<text class="lab" x="404" y="396">RESULT</text>
<text class="body" x="404" y="418">A fitted model that turns new</text>
<text class="body" x="404" y="440">measurements into predictions</text>
<line class="rule" x1="404" y1="456" x2="734" y2="456"/>
<text class="lab" x="404" y="480">CHECKED BY</text>
<text class="body" x="404" y="502">The error on data held back</text>
<text class="body" x="404" y="524">from fitting: a test set</text>
<line class="rule" x1="404" y1="540" x2="734" y2="540"/>
<text class="lab" x="404" y="564">RISK</text>
<text class="body" x="404" y="586">Good predictions, no single effect</text>
</svg>
