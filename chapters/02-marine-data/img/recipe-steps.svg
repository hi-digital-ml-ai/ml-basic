<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 400" width="100%" role="img" aria-label="A recipe in three stages. First, specify: recipe() lists the steps, such as fill gaps, take logs, make dummy columns and standardise. Second, estimate: prep() works out the numbers each step needs, such as medians, means, standard deviations and category levels, from the training data only. Third, apply: bake() uses those stored numbers on any data, training or test. The test data never shapes the numbers.">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a949c"/></marker>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .code { font: 17px "Source Code Pro", Menlo, Consolas, monospace; fill: #1b6a87; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; fill: #ffffff; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .ln   { fill: none; stroke: #8a949c; stroke-width: 1.8; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">A recipe: specify, estimate, apply</text>

<!-- data pills -->
<rect x="355" y="58" width="230" height="36" rx="18" fill="#0072B2"/>
<text class="lab" x="470" y="81" text-anchor="middle">TRAINING DATA ONLY</text>
<line class="ln" x1="470" y1="96" x2="470" y2="130" marker-end="url(#arr)"/>

<rect x="695" y="58" width="230" height="36" rx="18" fill="#55606a"/>
<text class="lab" x="810" y="81" text-anchor="middle">TRAINING OR TEST DATA</text>
<line class="ln" x1="810" y1="96" x2="810" y2="130" marker-end="url(#arr)"/>

<!-- stage cards -->
<rect class="box" x="0" y="136" width="260" height="186" rx="8"/><rect x="0" y="136" width="260" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="20" y="176">1 Specify</text>
<text class="code" x="20" y="204">recipe()</text>
<text class="body" x="20" y="238">the steps: fill gaps,</text>
<text class="body" x="20" y="262">take logs, make dummy</text>
<text class="body" x="20" y="286">columns, standardise</text>

<rect class="box" x="340" y="136" width="260" height="186" rx="8"/><rect x="340" y="136" width="260" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="360" y="176">2 Estimate</text>
<text class="code" x="360" y="204">prep()</text>
<text class="body" x="360" y="238">the numbers each step</text>
<text class="body" x="360" y="262">needs: medians, means,</text>
<text class="body" x="360" y="286">spreads, category levels</text>

<rect class="box" x="680" y="136" width="260" height="186" rx="8"/><rect x="680" y="136" width="260" height="6" rx="3" fill="#009E73"/>
<text class="head" x="700" y="176">3 Apply</text>
<text class="code" x="700" y="204">bake()</text>
<text class="body" x="700" y="238">the stored numbers,</text>
<text class="body" x="700" y="262">unchanged, to whatever</text>
<text class="body" x="700" y="286">data it is given</text>

<line class="ln" x1="264" y1="229" x2="336" y2="229" marker-end="url(#arr)"/>
<line class="ln" x1="604" y1="229" x2="676" y2="229" marker-end="url(#arr)"/>

<text class="note" x="470" y="358" text-anchor="middle">The test data is prepared with numbers it never influenced</text>
</svg>
