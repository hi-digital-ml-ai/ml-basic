<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 430" width="100%" role="img" aria-label="The parts of a data table. Each row is one observation. The columns temperature, salinity and depth are the features, the inputs a model learns from; the last column, species found, is the outcome it predicts. The first column names the site, and the first three rows come from the same site visited three times, so they are not three independent observations.">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a949c"/></marker>
<style>
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .th   { font: bold 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .td   { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .ln   { fill: none; stroke: #8a949c; stroke-width: 1.8; }
      .grid { stroke: #d5dee4; stroke-width: 1; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">The parts of a data table</text>

<g transform="translate(-26,0)">
<!-- column group labels -->
<path class="ln" d="M 262 104 L 262 96 L 638 96 L 638 104"/>
<text class="lab" x="450" y="84" text-anchor="middle" fill="#0072B2">FEATURES: THE INPUTS</text>
<path class="ln" d="M 644 104 L 644 96 L 800 96 L 800 104"/>
<text class="lab" x="722" y="84" text-anchor="middle" fill="#009E73">OUTCOME</text>

<!-- table: columns Site 150-260, Temperature 262-412, Salinity 412-532, Depth 532-640, Species found 642-800 -->
<rect x="262" y="112" width="378" height="252" fill="#0072B2" fill-opacity="0.07"/>
<rect x="642" y="112" width="158" height="252" fill="#009E73" fill-opacity="0.09"/>
<rect x="150" y="160" width="650" height="40" fill="#E69F00" fill-opacity="0.22"/>
<rect x="150" y="112" width="650" height="252" fill="none" stroke="#1b6a87" stroke-width="1.6" rx="4"/>
<line class="grid" x1="150" y1="160" x2="800" y2="160" style="stroke:#1b6a87;stroke-width:1.4"/>
<line class="grid" x1="150" y1="200" x2="800" y2="200"/>
<line class="grid" x1="150" y1="240" x2="800" y2="240"/>
<line class="grid" x1="150" y1="280" x2="800" y2="280"/>
<line class="grid" x1="150" y1="320" x2="800" y2="320"/>
<line class="grid" x1="262" y1="112" x2="262" y2="364"/>
<line class="grid" x1="642" y1="112" x2="642" y2="364"/>

<text class="th" x="206" y="143" text-anchor="middle">Site</text>
<text class="th" x="337" y="143" text-anchor="middle">Temperature</text>
<text class="th" x="472" y="143" text-anchor="middle">Salinity</text>
<text class="th" x="586" y="143" text-anchor="middle">Depth</text>
<text class="th" x="721" y="143" text-anchor="middle">Species found</text>

<g class="td" text-anchor="middle">
<text x="206" y="186">A</text><text x="337" y="186">6.2</text><text x="472" y="186">33.8</text><text x="586" y="186">91</text><text x="721" y="186">no</text>
<text x="206" y="226">A</text><text x="337" y="226">7.1</text><text x="472" y="226">33.7</text><text x="586" y="226">97</text><text x="721" y="226">no</text>
<text x="206" y="266">A</text><text x="337" y="266">9.1</text><text x="472" y="266">33.9</text><text x="586" y="266">82</text><text x="721" y="266">yes</text>
<text x="206" y="306">B</text><text x="337" y="306">3.9</text><text x="472" y="306">34.7</text><text x="586" y="306">126</text><text x="721" y="306">yes</text>
<text x="206" y="346">B</text><text x="337" y="346">4.8</text><text x="472" y="346">34.0</text><text x="586" y="346">161</text><text x="721" y="346">no</text>
</g>

<!-- one row -->
<text class="lab" x="64" y="176" text-anchor="middle" fill="#b36b00">ONE ROW</text>
<text class="note" x="64" y="198" text-anchor="middle">an observation</text>
<line class="ln" x1="124" y1="180" x2="144" y2="180" marker-end="url(#arr)"/>

<!-- repeat visits -->
<path class="ln" d="M 812 164 L 822 164 L 822 276 L 812 276"/>
<text class="note" x="834" y="200">Site A, visited</text>
<text class="note" x="834" y="222">three times:</text>
<text class="note" x="834" y="244">not three separate</text>
<text class="note" x="834" y="266">observations</text>

</g>
<text class="note" x="475" y="396" text-anchor="middle">Temperature in °C, salinity in PSU, depth in metres</text>
</svg>
