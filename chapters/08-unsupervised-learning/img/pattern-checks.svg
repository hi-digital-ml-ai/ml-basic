<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 640" width="100%" role="img" aria-label="Three checks before reporting a pattern. 1 Replication: three bootstrap samples, each clustered into a blue and an orange group, give the same grouping. 2 Group or gradient: where stations sit between the two cluster centres; groups leave a gap at the boundary half way, a gradient spreads stations evenly across it. 3 External check: the clusters line up with a recorded seabed type the method never saw. Below, a strip defines a bootstrap sample, the ARI and a recorded variable.">
