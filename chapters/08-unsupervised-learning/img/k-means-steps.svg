<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 540" width="100%" role="img" aria-label="k-means in three steps. First, place k centres, here two, at random among the points. Second, assign each point to its nearest centre. Third, move each centre to the average of the points assigned to it. Steps two and three repeat until no point changes group. Each round lowers the within-cluster sum of squares, the squared distance from every point to its own centre, added up.">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a949c"/></marker>
<marker id="mv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/></marker>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .ln   { fill: none; stroke: #8a949c; stroke-width: 1.8; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">k-means: place, assign, move, repeat</text>

