<path d="M 615.0 273.0 L 690 273.0" stroke="#0072B2" stroke-width="2.6" fill="none" stroke-linecap="round"/>
<path d="M 795.0 336.0 L 795.0 255.0" stroke="#E69F00" stroke-width="2.6" fill="none" stroke-linecap="round"/>
<path d="M 870 390 L 870 255.0" stroke="#E69F00" stroke-width="2.6" fill="none" stroke-linecap="round"/>
<path d="M 795.0 255.0 L 870 255.0" stroke="#E69F00" stroke-width="2.6" fill="none" stroke-linecap="round"/>
<path d="M 652.5 273.0 L 652.5 138.00000000000003" stroke="#8a949c" stroke-width="2.6" fill="none" stroke-linecap="round"/>
<path d="M 832.5 255.0 L 832.5 138.00000000000003" stroke="#8a949c" stroke-width="2.6" fill="none" stroke-linecap="round"/>
<path d="M 652.5 138.00000000000003 L 832.5 138.00000000000003" stroke="#8a949c" stroke-width="2.6" fill="none" stroke-linecap="round"/>
<path d="M 742.5 138.00000000000003 L 742.5 128.00000000000003" stroke="#8a949c" stroke-width="2.6" fill="none" stroke-linecap="round"/>
<text class="lab" x="590" y="412" text-anchor="middle">a</text>
<text class="lab" x="640" y="412" text-anchor="middle">b</text>
<text class="lab" x="690" y="412" text-anchor="middle">c</text>
<text class="lab" x="770" y="412" text-anchor="middle">d</text>
<text class="lab" x="820" y="412" text-anchor="middle">e</text>
<text class="lab" x="870" y="412" text-anchor="middle">f</text>
<line class="cut" x1="530" y1="190" x2="910" y2="190"/>
<line class="cut" x1="530" y1="305" x2="910" y2="305"/>
<text class="lab" x="742.5" y="182" text-anchor="middle">2 groups</text>
<text class="lab" x="742.5" y="297" text-anchor="middle">4 groups</text>
<text class="body" x="720" y="450" text-anchor="middle">each join sits at the distance it bridged;</text>
<text class="body" x="720" y="474" text-anchor="middle">cut at any height to get groups</text>
<line class="ln" x1="446" y1="280.0" x2="494" y2="280.0" marker-end="url(#arr)"/>

<!-- linkage rules -->
<text class="head" x="470" y="560" text-anchor="middle">How far apart are two groups? The linkage rule decides</text>
<rect class="box" x="0" y="580" width="220" height="236" rx="8"/><rect x="0" y="580" width="220" height="6" rx="3" fill="#55606a"/>
<text class="small" x="20" y="614">Single</text>
<path d="M 70 724 L 150 704" stroke="#1f2933" stroke-width="2.6" fill="none" stroke-linecap="round"/>
<circle cx="50" cy="692" r="7" fill="#0072B2" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="80" cy="670" r="7" fill="#0072B2" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="70" cy="724" r="7" fill="#0072B2" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="150" cy="704" r="7" fill="#E69F00" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="188" cy="682" r="7" fill="#E69F00" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="176" cy="740" r="7" fill="#E69F00" stroke="#ffffff" stroke-width="1.5"/>
<text class="body" x="110" y="772" text-anchor="middle">distance between the</text>
<text class="body" x="110" y="794" text-anchor="middle">two nearest members</text>
<rect class="box" x="240" y="580" width="220" height="236" rx="8"/><rect x="240" y="580" width="220" height="6" rx="3" fill="#55606a"/>
<text class="small" x="260" y="614">Complete</text>
<path d="M 290 692 L 428 682" stroke="#1f2933" stroke-width="2.6" fill="none" stroke-linecap="round"/>
<circle cx="290" cy="692" r="7" fill="#0072B2" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="320" cy="670" r="7" fill="#0072B2" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="310" cy="724" r="7" fill="#0072B2" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="390" cy="704" r="7" fill="#E69F00" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="428" cy="682" r="7" fill="#E69F00" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="416" cy="740" r="7" fill="#E69F00" stroke="#ffffff" stroke-width="1.5"/>
<text class="body" x="350" y="772" text-anchor="middle">distance between the</text>
<text class="body" x="350" y="794" text-anchor="middle">two furthest members</text>
<rect class="box" x="480" y="580" width="220" height="236" rx="8"/><rect x="480" y="580" width="220" height="6" rx="3" fill="#55606a"/>
<text class="small" x="500" y="614">Average</text>
<path d="M 530 692 L 630 704" stroke="#1f2933" stroke-width="1.1" fill="none" stroke-linecap="round"/>
<path d="M 530 692 L 668 682" stroke="#1f2933" stroke-width="1.1" fill="none" stroke-linecap="round"/>
