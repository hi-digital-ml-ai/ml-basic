<circle cx="656" cy="740" r="7" fill="#E69F00" stroke="#ffffff" stroke-width="1.5"/>
<text class="body" x="590" y="772" text-anchor="middle">average distance</text>
<text class="body" x="590" y="794" text-anchor="middle">over all pairs</text>
<rect class="box" x="720" y="580" width="220" height="236" rx="8"/><rect x="720" y="580" width="220" height="6" rx="3" fill="#55606a"/>
