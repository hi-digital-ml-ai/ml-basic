<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 860" width="100%" role="img" aria-label="Hierarchical clustering in two steps and four linkage rules. 1 Join: six points, a to f, in two loose groups; dashed outlines numbered 1 to 4 show the order of joins, a with b first, then d with e, then c joins a and b, then f joins d and e. 2 Cut: the same joins drawn as a tree over the leaves a to f, each join at the height of the distance between the two groups; a dashed line high on the tree cuts it into 2 groups, a lower one into 4. Below, four small cards show how each linkage rule measures the distance between a blue and an orange group: single uses the two nearest members, complete the two furthest, average all pairs, and Ward how much the sum of squares rises if the groups are joined.">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a949c"/></marker>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .small{ font: bold 19px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 16px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .num  { font: bold 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #ffffff; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .ln   { fill: none; stroke: #8a949c; stroke-width: 1.8; }
      .hull { fill: none; stroke: #8a949c; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .cut  { stroke: #1f2933; stroke-width: 1.6; stroke-dasharray: 7 5; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">Hierarchical clustering: join the closest groups, then cut the tree</text>

<!-- 1 Join -->
<rect class="box" x="0" y="60" width="440" height="440" rx="8"/><rect x="0" y="60" width="440" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="20" y="100">1  Join</text>
<ellipse class="hull" cx="122" cy="181" rx="42" ry="25" transform="rotate(-22 122 181)"/>
<ellipse class="hull" cx="312" cy="321" rx="42" ry="25" transform="rotate(22 312 321)"/>
<ellipse class="hull" cx="128" cy="216" rx="76" ry="82"/>
<ellipse class="hull" cx="322" cy="290" rx="74" ry="84"/>
<circle cx="100" cy="190" r="9" fill="#0072B2" stroke="#ffffff" stroke-width="1.5"/>
<text class="lab" x="114" y="182">a</text>
<circle cx="145" cy="172" r="9" fill="#0072B2" stroke="#ffffff" stroke-width="1.5"/>
<text class="lab" x="159" y="164">b</text>
<circle cx="150" cy="262" r="9" fill="#0072B2" stroke="#ffffff" stroke-width="1.5"/>
<text class="lab" x="164" y="254">c</text>
<circle cx="290" cy="312" r="9" fill="#E69F00" stroke="#ffffff" stroke-width="1.5"/>
<text class="lab" x="304" y="304">d</text>
<circle cx="334" cy="330" r="9" fill="#E69F00" stroke="#ffffff" stroke-width="1.5"/>
<text class="lab" x="348" y="322">e</text>
<circle cx="350" cy="238" r="9" fill="#E69F00" stroke="#ffffff" stroke-width="1.5"/>
<text class="lab" x="364" y="230">f</text>
<circle cx="84" cy="160" r="11" fill="#55606a"/><text class="num" x="84" y="165" text-anchor="middle">1</text>
<circle cx="352" cy="352" r="11" fill="#55606a"/><text class="num" x="352" y="357" text-anchor="middle">2</text>
<circle cx="60" cy="270" r="11" fill="#55606a"/><text class="num" x="60" y="275" text-anchor="middle">3</text>
<circle cx="390" cy="226" r="11" fill="#55606a"/><text class="num" x="390" y="231" text-anchor="middle">4</text>
<text class="body" x="220" y="450" text-anchor="middle">join the two closest groups,</text>
<text class="body" x="220" y="474" text-anchor="middle">again and again, until one is left</text>

<!-- 2 Cut -->
<rect class="box" x="500" y="60" width="440" height="440" rx="8"/><rect x="500" y="60" width="440" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="520" y="100">2  Cut</text>
<path d="M 590 390 L 590 345.0" stroke="#0072B2" stroke-width="2.6" fill="none" stroke-linecap="round"/>
<path d="M 640 390 L 640 345.0" stroke="#0072B2" stroke-width="2.6" fill="none" stroke-linecap="round"/>
