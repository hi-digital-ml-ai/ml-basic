<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 680" width="100%" role="img" aria-label="Principal component analysis in two steps. 1 Find the directions: a cloud of points plotted on column A against column B stretches diagonally; an arrow labelled PC1 runs along the longest spread and a shorter arrow labelled PC2 runs at a right angle to it. 2 Read the points on the new axes: the same cloud turned so that PC1 is horizontal and PC2 vertical; one point is marked, with its score on PC1 read off the horizontal axis. Below, a strip defines the terms: loadings are the weights that build a component from the columns, for example PC1 equals 0.8 times A plus 0.6 times B; a score is a point's value on a component; components are ordered by the share of the variance they hold, PC1 most.">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a949c"/></marker>
