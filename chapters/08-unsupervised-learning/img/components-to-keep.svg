<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 690" width="100%" role="img" aria-label="Two ways to choose how many components to keep. 1 Beat the shuffled baseline: a bar chart of the share of the variance held by components 1 to 10, falling from left to right, with a line for the share each component holds when every column is shuffled; the first three bars rise above the line and are kept. 2 Ask the model that uses them: cross-validated error against the number of components kept falls steeply, then levels off; a dotted line one standard error above the lowest error marks the fewest components that do about as well as the best. Below, a strip defines the terms: the 80 per cent rule, the shuffled baseline and cross-validation.">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a949c"/></marker>
<marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a949c"/></marker>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .bodyb{ font: bold 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .lab  { font: bold 16px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .labv { font: bold 16px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #D55E00; }
      .labb { font: bold 16px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #0072B2; }
      .ln   { fill: none; stroke: #8a949c; stroke-width: 1.8; }
      .axis { stroke: #8a949c; stroke-width: 1.5; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">Two ways to choose how many components to keep</text>
<rect class="box" x="0" y="60" width="440" height="400" rx="8"/><rect x="0" y="60" width="440" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="20" y="100">1  Beat the shuffled baseline</text>
<line class="axis" x1="60" y1="380" x2="415" y2="380" marker-end="url(#ax)"/>
<line class="axis" x1="60" y1="380" x2="60" y2="130" marker-end="url(#ax)"/>
<text class="lab" x="410" y="404" text-anchor="end">component</text>
<text class="lab" x="70" y="142">share of the variance</text>
<rect x="78" y="190" width="24" height="190" fill="#0072B2" fill-opacity="0.95"/>
<text class="lab" x="90.0" y="400" text-anchor="middle" font-size="14">1</text>
<rect x="110" y="218" width="24" height="162" fill="#0072B2" fill-opacity="0.95"/>
<text class="lab" x="122.0" y="400" text-anchor="middle" font-size="14">2</text>
<rect x="142" y="306" width="24" height="74" fill="#0072B2" fill-opacity="0.95"/>
<text class="lab" x="154.0" y="400" text-anchor="middle" font-size="14">3</text>
<rect x="174" y="321" width="24" height="59" fill="#8a949c" fill-opacity="0.55"/>

<rect x="206" y="326" width="24" height="54" fill="#8a949c" fill-opacity="0.55"/>

<rect x="238" y="328" width="24" height="52" fill="#8a949c" fill-opacity="0.55"/>

<rect x="270" y="330" width="24" height="50" fill="#8a949c" fill-opacity="0.55"/>

<rect x="302" y="334" width="24" height="46" fill="#8a949c" fill-opacity="0.55"/>

<rect x="334" y="337" width="24" height="43" fill="#8a949c" fill-opacity="0.55"/>

<rect x="366" y="339" width="24" height="41" fill="#8a949c" fill-opacity="0.55"/>

<polyline fill="none" stroke="#D55E00" stroke-width="3" points="90.0,311.0 122.0,315.0 154.0,317.0 186.0,319.0 218.0,320.0 250.0,322.0 282.0,324.0 314.0,325.0 346.0,327.0 378.0,329.0"/>
<text class="labv" x="384.0" y="281" text-anchor="end">shuffled</text>
<text class="labb" x="168" y="230">kept</text>
<text class="body" x="220" y="446" text-anchor="middle">keep the components above the line</text>
<rect class="box" x="500" y="60" width="440" height="400" rx="8"/><rect x="500" y="60" width="440" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="520" y="100">2  Ask the model that uses them</text>
<line class="axis" x1="560" y1="380" x2="915" y2="380" marker-end="url(#ax)"/>
<line class="axis" x1="560" y1="380" x2="560" y2="130" marker-end="url(#ax)"/>
<text class="lab" x="910" y="404" text-anchor="end">components kept</text>
<text class="lab" x="570" y="142">cross-validated error</text>
<line x1="572" y1="296" x2="905" y2="296" stroke="#1f2933" stroke-width="1.4" stroke-dasharray="3 4"/>
<line x1="590" y1="176" x2="590" y2="204" stroke="#8a949c" stroke-width="1.6"/>
<line x1="622" y1="284" x2="622" y2="312" stroke="#8a949c" stroke-width="1.6"/>
<line x1="654" y1="290" x2="654" y2="318" stroke="#8a949c" stroke-width="1.6"/>
<line x1="686" y1="294" x2="686" y2="322" stroke="#8a949c" stroke-width="1.6"/>
<line x1="718" y1="296" x2="718" y2="324" stroke="#8a949c" stroke-width="1.6"/>
<line x1="750" y1="295" x2="750" y2="323" stroke="#8a949c" stroke-width="1.6"/>
<line x1="782" y1="296" x2="782" y2="324" stroke="#8a949c" stroke-width="1.6"/>
<line x1="814" y1="294" x2="814" y2="322" stroke="#8a949c" stroke-width="1.6"/>
<line x1="846" y1="293" x2="846" y2="321" stroke="#8a949c" stroke-width="1.6"/>
<line x1="878" y1="292" x2="878" y2="320" stroke="#8a949c" stroke-width="1.6"/>
<polyline fill="none" stroke="#0072B2" stroke-width="2.6" points="590.0,190.0 622.0,298.0 654.0,304.0 686.0,308.0 718.0,310.0 750.0,309.0 782.0,310.0 814.0,308.0 846.0,307.0 878.0,306.0"/>
<circle cx="590" cy="190" r="5" fill="#0072B2" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="622" cy="298" r="7.5" fill="#D55E00" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="654" cy="304" r="5" fill="#0072B2" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="686" cy="308" r="5" fill="#0072B2" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="718" cy="310" r="5" fill="#0072B2" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="750" cy="309" r="5" fill="#0072B2" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="782" cy="310" r="5" fill="#0072B2" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="814" cy="308" r="5" fill="#0072B2" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="846" cy="307" r="5" fill="#0072B2" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="878" cy="306" r="5" fill="#0072B2" stroke="#ffffff" stroke-width="1.2"/>
<text class="lab" x="905" y="284" text-anchor="end">one standard error above the lowest</text>
<text class="labv" x="618" y="350">fewest that do as well</text>
<text class="body" x="720" y="446" text-anchor="middle">keep the fewest under the dotted line</text>
<text class="bodyb" x="470" y="266.0" text-anchor="middle">or</text>
<rect class="box" x="0" y="490" width="940" height="144" rx="8"/><rect x="0" y="490" width="940" height="6" rx="3" fill="#55606a"/>
<text class="bodyb" x="24" y="534">80% rule</text><text class="body" x="190" y="534">keep components until they hold 80% of the variance, noise included</text>
<text class="bodyb" x="24" y="570">Baseline</text><text class="body" x="190" y="570">each column shuffled on its own: the shares components reach with no structure</text>
<text class="bodyb" x="24" y="606">Cross-validation</text><text class="body" x="190" y="606">PCA refitted in every fold, so the held-out stations stay unseen</text>
</svg>
