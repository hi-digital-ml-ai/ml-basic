<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 600" width="100%" role="img" aria-label="A baseline with no groups. Left, the observed table: six rows and five columns, shaded by value; the first three rows are high in columns A and B, the last three high in D and E, so the rows fall into two groups. An arrow labelled shuffle each column on its own leads to the right, the shuffled table: every column holds the same values as before, in a new random order, so no rows share a pattern. A note says cluster both tables the same way; only what the observed table shows beyond the shuffled one counts as structure.">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a949c"/></marker>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .col  { font: bold 16px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .ln   { fill: none; stroke: #8a949c; stroke-width: 1.8; }
      .cell { stroke: #8a949c; stroke-width: 1; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">A baseline with no groups: shuffle each column on its own</text>

