<text class="body" x="740" y="454" text-anchor="middle">each column keeps its own values;</text>
<text class="body" x="740" y="478" text-anchor="middle">which values occur together is lost</text>

<line class="ln" x1="406" y1="280.0" x2="534" y2="280.0" marker-end="url(#arr)"/>
<text class="body" x="470" y="240.0" text-anchor="middle">shuffle</text>
<text class="body" x="470" y="264.0" text-anchor="middle">each column</text>

<text class="note" x="470" y="544" text-anchor="middle">Cluster both tables the same way. Only what the observed table shows</text>
<text class="note" x="470" y="568" text-anchor="middle">beyond the shuffled one counts as structure.</text>
</svg>
