<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 548" width="100%" role="img" aria-label="Three methods fitted to the same falling data and asked about values beyond it. Each card shows the same points falling across the left part of a small chart, a shaded region on the right marked beyond the data, and a dashed true curve that keeps falling gently towards zero. Linear regression: a straight line carries on at the same slope into the shaded region and drops below zero. Polynomial regression: a curve follows the points and turns back upward past the data. Random forest: a stepped line follows the points and runs flat across the shaded region at the value of the last points. A note says none of them shows that it has left the data.">
