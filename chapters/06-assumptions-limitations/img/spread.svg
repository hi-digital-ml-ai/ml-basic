<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 500" width="100%" role="img" aria-label="What the distribution decides. Skewed errors, widen as predictions grow: a scatter of points that fans out to the right around a rising line; most models predict well anyway. Log counts aim below the average: a histogram with a long right tail, a dashed line at the median marked log counts aim here and a solid line at the average marked a total needs this. Intervals follow the errors: the fan-shaped scatter with a grey band of one width reaching below zero, and a blue band from quantiles that starts narrow above zero and widens to the right. A note says the distribution decides what a prediction means and how sure it can be.">
<defs>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .ax   { fill: none; stroke: #8a949c; stroke-width: 1.6; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">What the distribution decides</text>
<rect class="box" x="0" y="48" width="294" height="362" rx="8"/><rect x="0" y="48" width="294" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="22" y="90">Skewed errors</text>
<text class="lab" x="22" y="114" fill="#0072B2">WIDEN AS PREDICTIONS GROW</text>
<text class="body" x="22" y="348">Most models predict well</text>
<text class="body" x="22" y="372">anyway; the checks say</text>
<text class="body" x="22" y="396">where to take care.</text>
<rect class="box" x="323" y="48" width="294" height="362" rx="8"/><rect x="323" y="48" width="294" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="345" y="90">Log counts</text>
<text class="lab" x="345" y="114" fill="#D55E00">AIM BELOW THE AVERAGE</text>
<text class="body" x="345" y="348">Squared error on log counts</text>
<text class="body" x="345" y="372">aims at the typical catch,</text>
<text class="body" x="345" y="396">so totals come out short.</text>
<rect class="box" x="646" y="48" width="294" height="362" rx="8"/><rect x="646" y="48" width="294" height="6" rx="3" fill="#009E73"/>
<text class="head" x="668" y="90">Intervals</text>
<text class="lab" x="668" y="114" fill="#009E73">FOLLOW THE ERRORS</text>
<text class="body" x="668" y="348">A Normal band has one width;</text>
<text class="body" x="668" y="372">quantiles widen where the</text>
<text class="body" x="668" y="396">catches do.</text>
