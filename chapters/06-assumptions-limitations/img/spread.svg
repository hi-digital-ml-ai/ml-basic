<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 697 524" width="100%" role="img" aria-label="What a loss aims at. Skewed errors, widen as predictions grow: a scatter of points that fans out to the right around a rising line; most models predict well anyway. Each loss aims at a different point: a histogram of catches with a long right tail, with lines at the median and the average; absolute error aims at the median, squared error at the average. A note says that for skewed counts the loss decides which middle a prediction stands for.">
<defs>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .ax   { fill: none; stroke: #8a949c; stroke-width: 1.6; }
    </style>
</defs>
<text class="title" x="308" y="26" text-anchor="middle">What a loss aims at</text>
<rect class="box" x="0" y="48" width="294" height="386" rx="8"/><rect x="0" y="48" width="294" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="22" y="90">Skewed errors</text>
<text class="lab" x="22" y="114" fill="#0072B2">WIDEN AS PREDICTIONS GROW</text>
<text class="body" x="22" y="346">Most models predict well</text>
<text class="body" x="22" y="370">anyway; the checks say</text>
<text class="body" x="22" y="394">where to take care.</text>
<rect class="box" x="323" y="48" width="294" height="386" rx="8"/><rect x="323" y="48" width="294" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="345" y="90">Each loss</text>
<text class="lab" x="345" y="114" fill="#D55E00">AIMS AT A DIFFERENT POINT</text>
<text class="body" x="345" y="346">Absolute error aims at</text>
<text class="body" x="345" y="370">the median, squared error</text>
<text class="body" x="345" y="394">at the average.</text>
