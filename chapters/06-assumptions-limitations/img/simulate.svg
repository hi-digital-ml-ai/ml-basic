<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 500" width="100%" role="img" aria-label="How simulating from a fitted model tests its distribution. Fitted model: the model gives each station an expected count, drawn as bars, and says how counts scatter around it. Simulated surveys: each station gets a random count from that distribution, and this is repeated to make many surveys, shown as a grid of counts with the empty stations shaded. Compare: a feature such as the number of empty stations is counted in each simulated survey, giving a histogram, and the real survey's value is a dashed line far to its right, so the model fails. A note says a model that could have produced the survey makes surveys that look like it.">
<defs>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .cell { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .ax   { fill: none; stroke: #8a949c; stroke-width: 1.6; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">Simulating from a fitted model</text>
<rect class="box" x="0" y="48" width="294" height="362" rx="8"/><rect x="0" y="48" width="294" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="22" y="90">Fitted model</text>
<text class="lab" x="22" y="114" fill="#0072B2">AN EXPECTED COUNT PER STATION</text>
<text class="body" x="22" y="348">The model gives each</text>
<text class="body" x="22" y="372">station an expected count,</text>
<text class="body" x="22" y="396">and says how counts scatter.</text>
<rect class="box" x="323" y="48" width="294" height="362" rx="8"/><rect x="323" y="48" width="294" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="345" y="90">Simulated surveys</text>
<text class="lab" x="345" y="114" fill="#D55E00">DRAW NEW COUNTS, MANY TIMES</text>
<text class="body" x="345" y="348">Each station gets a random</text>
<text class="body" x="345" y="372">count from that distribution;</text>
<text class="body" x="345" y="396">repeat for many surveys.</text>
<rect class="box" x="646" y="48" width="294" height="362" rx="8"/><rect x="646" y="48" width="294" height="6" rx="3" fill="#009E73"/>
<text class="head" x="668" y="90">Compare</text>
<text class="lab" x="668" y="114" fill="#009E73">THE REAL SURVEY AMONG THEM</text>
<text class="body" x="668" y="348">Count a feature in each,</text>
<text class="body" x="668" y="372">here the empty stations. Far</text>
<text class="body" x="668" y="396">outside: the model fails.</text>
