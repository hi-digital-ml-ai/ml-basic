<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 500" width="100%" role="img" aria-label="Two ways to resample a survey whose sites have repeat visits. The survey: four sites, A to D, each a box holding three to five visits drawn as dots in the site's colour; visits to one site share its water and seabed, so they tend to agree. Resample stations: sixteen draws of a single visit each, so the colours are mixed and a site's visits are split up; every row counts as separate evidence. Resample sites: four draws of a whole site with all its visits, site C drawn twice and site B not at all; only sites count as separate evidence. A note says that if resampling sites spreads an estimate wider, the visits were repeating each other.">
<defs>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">Resampling stations or whole sites</text>
<rect class="box" x="0" y="48" width="294" height="362" rx="8"/><rect x="0" y="48" width="294" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="22" y="90">The survey</text>
<text class="lab" x="22" y="114" fill="#0072B2">SITES WITH REPEAT VISITS</text>
<text class="body" x="22" y="348">Visits to one site share</text>
<text class="body" x="22" y="372">its water and seabed, so</text>
<text class="body" x="22" y="396">they tend to agree.</text>
<rect class="box" x="323" y="48" width="294" height="362" rx="8"/><rect x="323" y="48" width="294" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="345" y="90">Resample stations</text>
<text class="lab" x="345" y="114" fill="#D55E00">DRAW ONE ROW AT A TIME</text>
<text class="body" x="345" y="348">Each draw takes a single</text>
<text class="body" x="345" y="372">visit, so every row counts</text>
<text class="body" x="345" y="396">as separate evidence.</text>
<rect class="box" x="646" y="48" width="294" height="362" rx="8"/><rect x="646" y="48" width="294" height="6" rx="3" fill="#009E73"/>
<text class="head" x="668" y="90">Resample sites</text>
<text class="lab" x="668" y="114" fill="#009E73">DRAW WHOLE SITES</text>
<text class="body" x="668" y="348">Each draw takes a site with</text>
<text class="body" x="668" y="372">all its visits, so only sites</text>
<text class="body" x="668" y="396">count as separate evidence.</text>
<rect x="49" y="140" width="92" height="60" rx="14" fill="#ffffff" stroke="#0072B2" stroke-width="1.6"/>
