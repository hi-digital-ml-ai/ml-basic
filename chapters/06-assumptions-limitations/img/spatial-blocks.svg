<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 600" width="100%" role="img" aria-label="Two ways to hold out sites when scoring a model, drawn on the same map of 44 sites. Cross-validation by site: seven held-out sites are scattered across the map, each joined by a short dashed line to a nearby site used for fitting, so a held-out site's position alone says a lot about it. Spatial blocks: the map is cut into a grid of six blocks and the sites in the top middle block are held out; their neighbours are held out with them and their dashed lines to the nearest fitted site are longer, so position says less about them. A note says blocks test what a model knows about areas it has not seen.">
