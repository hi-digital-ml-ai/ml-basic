<text class="sm" x="571.8" y="270.0">far</text>
<text class="sm" x="755.1" y="204.0">close</text>
<text class="body" x="507" y="372">Its nearest surveyed station is</text>
<text class="body" x="507" y="396">far away: the survey never met</text>
