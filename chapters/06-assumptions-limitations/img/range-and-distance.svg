<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 512" width="100%" role="img" aria-label="Two ways to check whether a new station lies within a survey, each drawn on the same chart of depth across and temperature down, where the surveyed stations form a band from warm, shallow water to cold, deep water. Range check, each input alone: a dashed box spans the survey's range of depth and of temperature, and a new shallow, cold station sits inside it, so it passes. Distance to the survey, all inputs together: a line joins the same station to its nearest surveyed station, a long way off across empty space, so it is flagged; a second new station inside the band has a short line and is close. A note says the inputs are standardised first, as for k-nearest neighbours.">
<defs>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .tiny { font: bold 12px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; fill: #55606a; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
    </style>
</defs>
<text class="title" x="470" y="10" text-anchor="middle">Is a new station within the survey?</text>
