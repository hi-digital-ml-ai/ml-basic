<text class="body" x="22" y="372">The new station lies inside the</text>
<text class="body" x="22" y="396">survey's range of depth and of</text>
<text class="body" x="22" y="420">temperature, so it passes.</text>
<rect class="box" x="485" y="32" width="455" height="400" rx="8"/><rect x="485" y="32" width="455" height="6" rx="3" fill="#D55E00"/>
<text class="head" x="507" y="74">Distance to the survey</text>
