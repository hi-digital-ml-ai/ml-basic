<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 500" width="100%" role="img" aria-label="From a miss to a fit. The residual is how far one prediction missed: observed minus predicted, positive above the line and negative below. The loss is the penalty for one miss: squared error grows fast with the miss, absolute error grows in step with it. The objective is the average loss over all the data, and the fit is the parameter value that makes it smallest. A note says: change the loss, and the fit changes with it.">
<defs>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .eq   { font: italic 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .ax   { fill: none; stroke: #8a949c; stroke-width: 1.6; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">From a miss to a fit</text>
<rect class="box" x="0" y="48" width="294" height="362" rx="8"/><rect x="0" y="48" width="294" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="22" y="90">Residual</text>
<text class="lab" x="22" y="114" fill="#0072B2">THE SIZE OF ONE MISS</text>
<text class="eq" x="22" y="146">residual = observed − predicted</text>
<path class="ax" d="M34 168 V295 H266"/>
<text class="sm" x="266" y="315" text-anchor="end">input</text>
<text class="sm" x="26" y="231.5" text-anchor="middle" transform="rotate(-90 26 231.5)" dy="-4">outcome</text>
<text class="body" x="22" y="348">Positive above the line,</text>
<text class="body" x="22" y="372">negative below it.</text>
<rect class="box" x="323" y="48" width="294" height="362" rx="8"/><rect x="323" y="48" width="294" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="345" y="90">Loss</text>
<text class="lab" x="345" y="114" fill="#D55E00">THE PENALTY FOR ONE MISS</text>
<text class="eq" x="345" y="146">squared or absolute error</text>
<path class="ax" d="M357 168 V295 H589"/>
<text class="sm" x="589" y="315" text-anchor="end">residual</text>
<text class="sm" x="349" y="231.5" text-anchor="middle" transform="rotate(-90 349 231.5)" dy="-4">penalty</text>
<text class="body" x="345" y="348">Squared error grows fast</text>
<text class="body" x="345" y="372">with the miss; absolute</text>
<text class="body" x="345" y="396">error grows in step.</text>
<rect class="box" x="646" y="48" width="294" height="362" rx="8"/><rect x="646" y="48" width="294" height="6" rx="3" fill="#009E73"/>
<text class="head" x="668" y="90">Objective</text>
<text class="lab" x="668" y="114" fill="#009E73">THE AVERAGE OVER ALL DATA</text>
<text class="eq" x="668" y="146">objective = average loss</text>
<path class="ax" d="M680 168 V295 H912"/>
<text class="sm" x="912" y="315" text-anchor="end">parameter</text>
<text class="sm" x="672" y="231.5" text-anchor="middle" transform="rotate(-90 672 231.5)" dy="-4">objective</text>
<text class="body" x="668" y="348">The fit is the parameter</text>
<text class="body" x="668" y="372">value that makes the</text>
<text class="body" x="668" y="396">average smallest.</text>
