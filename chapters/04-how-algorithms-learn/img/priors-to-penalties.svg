<text class="head" x="345" y="90">Normal prior</text>
<text class="lab" x="345" y="114" fill="#009E73">GIVES THE SQUARED PENALTY</text>
<text class="eq" x="345" y="146">ridge regression</text>
<text class="body" x="345" y="348">Most effects small; shrinks every</text>
<text class="body" x="345" y="372">coefficient but zeroes none.</text>
