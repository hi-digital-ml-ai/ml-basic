<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 500" width="100%" role="img" aria-label="Three priors, three penalties. A flat prior, which finds every coefficient equally plausible: it gives no penalty, which is maximum likelihood; a level line across the whole axis. A Normal prior centred on zero: it gives the squared penalty of ridge regression; a bell curve at zero, so most effects are small and large ones rare, and every coefficient is shrunk but none reaches zero. A Laplace prior: it gives the absolute penalty of lasso; a sharp peak at zero, which can set some coefficients exactly to zero. A note says: choose a prior on the coefficients, and its negative log is the penalty.">
<defs>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .eq   { font: italic 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .ax   { fill: none; stroke: #8a949c; stroke-width: 1.6; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">Three priors, three penalties</text>
<rect class="box" x="0" y="48" width="294" height="362" rx="8"/><rect x="0" y="48" width="294" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="22" y="90">Flat prior</text>
<text class="lab" x="22" y="114" fill="#0072B2">GIVES NO PENALTY</text>
<text class="eq" x="22" y="146">maximum likelihood</text>
<text class="body" x="22" y="348">A coefficient of 900 is as</text>
<text class="body" x="22" y="372">plausible as one of 0.9.</text>
