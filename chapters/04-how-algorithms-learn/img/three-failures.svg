<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 500" width="100%" role="img" aria-label="Three ways a search goes wrong. Stopped early: the search ran out of steps; a U-shaped objective with a row of dots stepping down one side and stopping partway, short of the lowest point; the fit reports converged is false, and the coefficients look normal. No lowest point: the objective keeps falling; a curve that falls towards a level it never reaches, with an arrow pointing further out; the fit reports a huge coefficient with a huge standard error. A different answer each run: random choices inside the fit; a row of dots for runs without a seed, spread along a scale of test error; a seed repeats one answer but does not remove the spread. A note says: each one still prints coefficients, so check for it.">
<defs>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .eq   { font: italic 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .ax   { fill: none; stroke: #8a949c; stroke-width: 1.6; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">Three ways a search goes wrong</text>
<rect class="box" x="0" y="48" width="294" height="362" rx="8"/><rect x="0" y="48" width="294" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="22" y="90">Stopped early</text>
<text class="lab" x="22" y="114" fill="#0072B2">RAN OUT OF STEPS</text>
<text class="eq" x="22" y="146">converged = FALSE</text>
<text class="body" x="22" y="348">Short of the lowest point, with</text>
<text class="body" x="22" y="372">coefficients that look normal.</text>
