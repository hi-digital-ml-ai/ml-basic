<circle cx="62" cy="185.8" r="6" fill="#0072B2"/>
<circle cx="80" cy="209.1" r="6" fill="#0072B2"/>
<circle cx="94" cy="224.2" r="6" fill="#0072B2"/>
<circle cx="105" cy="234.4" r="6" fill="#0072B2"/>
<text class="sm" x="114" y="224.4">stopped</text>
<path d="M164 174 l12 12 M176 174 l-12 12" stroke="#1f2933" stroke-width="2.4" transform="translate(0 82.0)"/>
<text class="sm" x="170" y="284.0" text-anchor="middle">lowest point</text>
<rect class="box" x="323" y="48" width="294" height="362" rx="8"/><rect x="323" y="48" width="294" height="6" rx="3" fill="#009E73"/>
<text class="head" x="345" y="90">No lowest point</text>
<text class="lab" x="345" y="114" fill="#009E73">THE OBJECTIVE KEEPS FALLING</text>
<text class="eq" x="345" y="146">huge coefficient, huge error</text>
<text class="body" x="345" y="348">The search walks off until a</text>
<text class="body" x="345" y="372">limit stops it.</text>
