<circle cx="383" cy="201.9" r="6" fill="#009E73"/>
<circle cx="423" cy="242.0" r="6" fill="#009E73"/>
<circle cx="473" cy="260.8" r="6" fill="#009E73"/>
<circle cx="523" cy="267.0" r="6" fill="#009E73"/>
<path d="M559 268.4 H581" stroke="#009E73" stroke-width="3"/><path d="M585 268.4 l-10 -6 v12 z" fill="#009E73"/>
<text class="sm" x="585" y="232.4" text-anchor="end">keeps going</text>
<rect class="box" x="646" y="48" width="294" height="362" rx="8"/><rect x="646" y="48" width="294" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="668" y="90">Different each run</text>
<text class="lab" x="668" y="114" fill="#D55E00">RANDOM CHOICES IN THE FIT</text>
<text class="eq" x="668" y="146">no seed, no repeat</text>
<text class="body" x="668" y="348">A seed repeats one answer; it</text>
<text class="body" x="668" y="372">does not remove the spread.</text>
<path class="ax" d="M680 168 V295 H912"/>
<text class="sm" x="912" y="315" text-anchor="end">test error</text>
<path d="M706 232 H886" stroke="#c9d1d7" stroke-width="2"/>
<circle cx="738" cy="222" r="7" fill="#E69F00" fill-opacity="0.75"/>
<circle cx="764" cy="242" r="7" fill="#E69F00" fill-opacity="0.75"/>
<circle cx="777" cy="220" r="7" fill="#E69F00" fill-opacity="0.75"/>
<circle cx="796" cy="240" r="7" fill="#E69F00" fill-opacity="0.75"/>
<circle cx="809" cy="226" r="7" fill="#E69F00" fill-opacity="0.75"/>
<circle cx="830" cy="244" r="7" fill="#E69F00" fill-opacity="0.75"/>
<circle cx="851" cy="224" r="7" fill="#E69F00" fill-opacity="0.75"/>
<text class="sm" x="796" y="200" text-anchor="middle">runs with no seed</text>
<path d="M738 262 H851 M738 256 v12 M851 256 v12" stroke="#D55E00" stroke-width="2"/>
<text class="sm" x="794" y="284" text-anchor="middle" fill="#D55E00">spread</text>
<text class="note" x="470" y="452" text-anchor="middle">Each one still prints coefficients and predictions, so check for it.</text>
</svg>
