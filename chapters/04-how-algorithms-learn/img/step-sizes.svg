<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 500" width="100%" role="img" aria-label="Three step sizes on the same objective. Too small, the rate far below the limit: the walk crawls, every step safe but hundreds needed. About right, below the limit: it reaches the bottom in a handful of steps. Too large, above the limit: it diverges, each step landing further from the bottom than the last. A note says the steeper the objective, the smaller the largest safe step.">
<defs>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .eq   { font: italic 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .ax   { fill: none; stroke: #8a949c; stroke-width: 1.6; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">Three step sizes on the same objective</text>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1f2933"/></marker></defs>
<rect class="box" x="0" y="48" width="294" height="362" rx="8"/><rect x="0" y="48" width="294" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="22" y="90">Too small</text>
<text class="lab" x="22" y="114" fill="#0072B2">CRAWLS</text>
<text class="eq" x="22" y="146">rate far below the limit</text>
<text class="body" x="22" y="348">Every step is safe, but</text>
<text class="body" x="22" y="372">it needs hundreds of them.</text>
<path class="ax" d="M34 168 V295 H266"/>
<text class="sm" x="266" y="315" text-anchor="end">parameter</text>
<text class="sm" x="26" y="231.5" text-anchor="middle" transform="rotate(-90 26 231.5)" dy="-4">objective</text>
<rect class="box" x="323" y="48" width="294" height="362" rx="8"/><rect x="323" y="48" width="294" height="6" rx="3" fill="#009E73"/>
<text class="head" x="345" y="90">About right</text>
<text class="lab" x="345" y="114" fill="#009E73">ARRIVES</text>
<text class="eq" x="345" y="146">rate below the limit</text>
<text class="body" x="345" y="348">Reaches the bottom in</text>
<text class="body" x="345" y="372">a handful of steps.</text>
<path class="ax" d="M357 168 V295 H589"/>
<text class="sm" x="589" y="315" text-anchor="end">parameter</text>
<text class="sm" x="349" y="231.5" text-anchor="middle" transform="rotate(-90 349 231.5)" dy="-4">objective</text>
<rect class="box" x="646" y="48" width="294" height="362" rx="8"/><rect x="646" y="48" width="294" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="668" y="90">Too large</text>
<text class="lab" x="668" y="114" fill="#D55E00">DIVERGES</text>
<text class="eq" x="668" y="146">rate above the limit</text>
<text class="body" x="668" y="348">Each step lands further</text>
<text class="body" x="668" y="372">from the bottom than the last.</text>
<path class="ax" d="M680 168 V295 H912"/>
<text class="sm" x="912" y="315" text-anchor="end">parameter</text>
<text class="sm" x="672" y="231.5" text-anchor="middle" transform="rotate(-90 672 231.5)" dy="-4">objective</text>
