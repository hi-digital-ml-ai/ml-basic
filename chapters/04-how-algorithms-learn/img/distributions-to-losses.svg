<path d="M100 172 V295" stroke="#1f2933" stroke-width="1.4" stroke-dasharray="4 3"/>
<text class="sm" x="100" y="315" text-anchor="middle">0</text>
<path d="M160 180 V295" stroke="#0072B2" stroke-width="1.4" stroke-dasharray="4 3"/>
<text class="sm" x="168" y="182">prediction</text>
<rect x="368" y="270.6" width="14" height="24.4" fill="#009E73"/>
<text class="sm" x="375" y="315" text-anchor="middle">0</text>
<rect x="388" y="221.7" width="14" height="73.3" fill="#009E73"/>
<rect x="408" y="185.0" width="14" height="110.0" fill="#009E73"/>
<rect x="428" y="185.0" width="14" height="110.0" fill="#009E73"/>
