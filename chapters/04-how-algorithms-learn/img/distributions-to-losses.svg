<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 500" width="100%" role="img" aria-label="Three distributions, three losses. Normal, for a measurement that can take any value: its negative log-likelihood is squared error; a bell curve around the prediction, same spread everywhere, with part of it below zero, so it allows values below zero even for a count. Poisson, for a count: it gives Poisson deviance; bars for counts of 0, 1, 2 and up, whose spread grows with the expected count. Bernoulli, for presence or absence: it gives log loss; two bars, a probability of presence and the rest for absence. A note says: name the distribution, and its negative log-likelihood is the loss.">
<defs>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .eq   { font: italic 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .ax   { fill: none; stroke: #8a949c; stroke-width: 1.6; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">Three distributions, three losses</text>
<rect class="box" x="0" y="48" width="294" height="362" rx="8"/><rect x="0" y="48" width="294" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="22" y="90">Normal</text>
<text class="lab" x="22" y="114" fill="#0072B2">GIVES SQUARED ERROR</text>
<text class="eq" x="22" y="146">a measurement, any value</text>
<text class="body" x="22" y="348">Same spread everywhere, and</text>
<text class="body" x="22" y="372">values below zero allowed.</text>
<path class="ax" d="M34 168 V295 H266"/>
<text class="sm" x="266" y="315" text-anchor="end">value</text>
<text class="sm" x="26" y="231.5" text-anchor="middle" transform="rotate(-90 26 231.5)" dy="-4">probability</text>
<rect class="box" x="323" y="48" width="294" height="362" rx="8"/><rect x="323" y="48" width="294" height="6" rx="3" fill="#009E73"/>
<text class="head" x="345" y="90">Poisson</text>
<text class="lab" x="345" y="114" fill="#009E73">GIVES POISSON DEVIANCE</text>
<text class="eq" x="345" y="146">a count: 0, 1, 2, …</text>
<text class="body" x="345" y="348">Whole numbers from zero, with</text>
<text class="body" x="345" y="372">spread growing with the mean.</text>
<path class="ax" d="M357 168 V295 H589"/>
<text class="sm" x="589" y="315" text-anchor="end">count</text>
<text class="sm" x="349" y="231.5" text-anchor="middle" transform="rotate(-90 349 231.5)" dy="-4">probability</text>
<rect class="box" x="646" y="48" width="294" height="362" rx="8"/><rect x="646" y="48" width="294" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="668" y="90">Bernoulli</text>
<text class="lab" x="668" y="114" fill="#D55E00">GIVES LOG LOSS</text>
<text class="eq" x="668" y="146">presence or absence</text>
<text class="body" x="668" y="348">One probability of presence;</text>
<text class="body" x="668" y="372">the rest goes to absence.</text>
<path class="ax" d="M680 168 V295 H912"/>
<text class="sm" x="672" y="231.5" text-anchor="middle" transform="rotate(-90 672 231.5)" dy="-4">probability</text>
