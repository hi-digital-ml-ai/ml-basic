<text class="sm" x="746" y="315" text-anchor="middle">absent</text>
<rect x="820" y="190.0" width="52" height="105.0" fill="#E69F00"/>
<text class="sm" x="846" y="315" text-anchor="middle">present</text>
<text class="note" x="470" y="452" text-anchor="middle">Name the distribution, and its negative log-likelihood is the loss.</text>
</svg>
