<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 500" width="100%" role="img" aria-label="Three ways to find the parameters. By formula, solved in one step: linear regression, exact and the same answer every time. By search, step by step downhill: Poisson and logistic regression repeat until the objective stops falling. One split at a time, greedy: trees, forests and boosting take the best split now and never go back to it. A note says a search can stop early or end somewhere else; a formula cannot.">
<defs>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .eq   { font: italic 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .ax   { fill: none; stroke: #8a949c; stroke-width: 1.6; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">Three ways to find the parameters</text>
<rect class="box" x="0" y="48" width="294" height="362" rx="8"/><rect x="0" y="48" width="294" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="22" y="90">By formula</text>
<text class="lab" x="22" y="114" fill="#0072B2">SOLVED IN ONE STEP</text>
<text class="eq" x="22" y="146">linear regression</text>
<text class="body" x="22" y="348">Exact, and the same</text>
<text class="body" x="22" y="372">answer every time.</text>
<path class="ax" d="M34 168 V295 H266"/>
<text class="sm" x="266" y="315" text-anchor="end">parameter</text>
<text class="sm" x="26" y="231.5" text-anchor="middle" transform="rotate(-90 26 231.5)" dy="-4">objective</text>
<rect class="box" x="323" y="48" width="294" height="362" rx="8"/><rect x="323" y="48" width="294" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="345" y="90">By search</text>
<text class="lab" x="345" y="114" fill="#D55E00">STEP BY STEP DOWNHILL</text>
<text class="eq" x="345" y="146">Poisson, logistic regression</text>
<text class="body" x="345" y="348">Repeats until the</text>
<text class="body" x="345" y="372">objective stops falling.</text>
<path class="ax" d="M357 168 V295 H589"/>
<text class="sm" x="589" y="315" text-anchor="end">parameter</text>
<text class="sm" x="349" y="231.5" text-anchor="middle" transform="rotate(-90 349 231.5)" dy="-4">objective</text>
<rect class="box" x="646" y="48" width="294" height="362" rx="8"/><rect x="646" y="48" width="294" height="6" rx="3" fill="#009E73"/>
<text class="head" x="668" y="90">One split at a time</text>
<text class="lab" x="668" y="114" fill="#009E73">GREEDY</text>
<text class="eq" x="668" y="146">trees, forests, boosting</text>
<text class="body" x="668" y="348">Takes the best split now</text>
<text class="body" x="668" y="372">and never goes back to it.</text>
