<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 510" width="100%" role="img" aria-label="Three checks before a claim, as three cards. Beats a baseline, checked by cross-validation: scored on sites it never saw, against predicting the average; two bars for the error on new sites, the model's shorter than the average's. Inputs the data separate, set by the survey's design: two inputs that move together cannot be told apart by any model; a scatter of stations along a diagonal band of depth against distance offshore, with the empty corners marked no stations. Records that match the water, checked outside the model: a gear that misses animals biases every fold alike; eight animals in the water on mud, four recorded. A note says cross-validation makes the first check, and the other two need knowledge of how the data were collected.">
<defs>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .ln   { fill: none; stroke: #8a949c; stroke-width: 1.6; }
    </style>
</defs>
