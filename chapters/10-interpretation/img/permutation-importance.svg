<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 490" width="100%" role="img" aria-label="Permutation importance in three steps. Score: predict the test data and measure the error. Shuffle one input: mix up its values so they no longer belong to their rows. Score again: the rise in error is that input's importance. A note says this is repeated for each input, several times over, on data the model was not fitted to.">
<defs>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .ax   { fill: none; stroke: #8a949c; stroke-width: 1.6; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">Permutation importance</text>
<rect class="box" x="0" y="48" width="294" height="384" rx="8"/><rect x="0" y="48" width="294" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="22" y="90">Score</text>
<text class="lab" x="22" y="114" fill="#0072B2">THE TEST DATA AS IT IS</text>
<text class="body" x="22" y="356">Predict the test data</text>
<text class="body" x="22" y="380">and measure the error.</text>
<rect class="box" x="323" y="48" width="294" height="384" rx="8"/><rect x="323" y="48" width="294" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="345" y="90">Shuffle one input</text>
<text class="lab" x="345" y="114" fill="#E69F00">ITS VALUES CHANGE ROWS</text>
<text class="body" x="345" y="356">Mix up the input's values,</text>
<text class="body" x="345" y="380">so they no longer belong</text>
<text class="body" x="345" y="404">to their rows.</text>
<rect class="box" x="646" y="48" width="294" height="384" rx="8"/><rect x="646" y="48" width="294" height="6" rx="3" fill="#009E73"/>
<text class="head" x="668" y="90">Score again</text>
<text class="lab" x="668" y="114" fill="#009E73">THE RISE IS THE IMPORTANCE</text>
<text class="body" x="668" y="356">Predict again. The rise</text>
<text class="body" x="668" y="380">in error is the input's</text>
<text class="body" x="668" y="404">importance.</text>
