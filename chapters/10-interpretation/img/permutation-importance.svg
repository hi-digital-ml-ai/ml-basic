<rect x="460" y="264" width="44" height="22" rx="3" fill="#0072B2" fill-opacity="0.65"/>
<text class="sm" x="546.0" y="150" text-anchor="middle">Outcome</text>
<rect x="524" y="160" width="44" height="22" rx="3" fill="#55606a" fill-opacity="0.6"/>
<rect x="524" y="186" width="44" height="22" rx="3" fill="#55606a" fill-opacity="0.3"/>
<rect x="524" y="212" width="44" height="22" rx="3" fill="#55606a" fill-opacity="0.8"/>
