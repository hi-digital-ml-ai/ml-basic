<rect x="201" y="264" width="44" height="22" rx="3" fill="#55606a" fill-opacity="0.5"/>
<text class="sm" x="382.0" y="150" text-anchor="middle">A</text>
<rect x="360" y="160" width="44" height="22" rx="3" fill="#0072B2" fill-opacity="0.85"/>
<rect x="360" y="186" width="44" height="22" rx="3" fill="#0072B2" fill-opacity="0.35"/>
<rect x="360" y="212" width="44" height="22" rx="3" fill="#0072B2" fill-opacity="0.6"/>
<rect x="360" y="238" width="44" height="22" rx="3" fill="#0072B2" fill-opacity="0.2"/>
<rect x="360" y="264" width="44" height="22" rx="3" fill="#0072B2" fill-opacity="0.7"/>
<text class="sm" x="432.0" y="150" text-anchor="middle">B</text>
<rect x="410" y="160" width="44" height="22" rx="3" fill="#0072B2" fill-opacity="0.75"/>
<rect x="410" y="186" width="44" height="22" rx="3" fill="#0072B2" fill-opacity="0.15"/>
<rect x="410" y="212" width="44" height="22" rx="3" fill="#0072B2" fill-opacity="0.9"/>
<rect x="410" y="238" width="44" height="22" rx="3" fill="#0072B2" fill-opacity="0.3"/>
<rect x="410" y="264" width="44" height="22" rx="3" fill="#0072B2" fill-opacity="0.5"/>
<rect x="405" y="155" width="54" height="136" rx="5" fill="none" stroke="#E69F00" stroke-width="2.4"/>
