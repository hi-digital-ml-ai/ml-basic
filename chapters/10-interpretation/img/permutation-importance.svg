<rect x="524" y="264" width="44" height="22" rx="3" fill="#55606a" fill-opacity="0.5"/>
<text class="sm" x="432" y="310" text-anchor="middle" fill="#E69F00">shuffled</text>
<line class="ax" x1="686" y1="290" x2="900" y2="290"/>
<rect x="710" y="220" width="56" height="70" fill="#0072B2" fill-opacity="0.75"/>
<rect x="796" y="220" width="56" height="70" fill="#0072B2" fill-opacity="0.75"/>
<rect x="796" y="162" width="56" height="58" fill="#009E73" fill-opacity="0.85"/>
<line x1="710" y1="220" x2="864" y2="220" stroke="#8a949c" stroke-width="1.4" stroke-dasharray="5 4"/>
<path d="M 862 162 h 8 v 58 h -8" fill="none" stroke="#009E73" stroke-width="2"/>
<text class="sm" x="876" y="196.0" fill="#009E73">rise</text>
<text class="sm" x="738.0" y="310" text-anchor="middle">Before</text>
<text class="sm" x="824.0" y="310" text-anchor="middle">After</text>
<text class="sm" x="686" y="148">Error</text>
<text class="note" x="470" y="464" text-anchor="middle">Repeat for each input, several times over, on data the model was not fitted to.</text>
