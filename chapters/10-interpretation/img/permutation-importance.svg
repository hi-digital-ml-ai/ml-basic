<text class="sm" x="159.0" y="150" text-anchor="middle">C</text>
<rect x="137" y="160" width="44" height="22" rx="3" fill="#0072B2" fill-opacity="0.55"/>
<rect x="137" y="186" width="44" height="22" rx="3" fill="#0072B2" fill-opacity="0.25"/>
