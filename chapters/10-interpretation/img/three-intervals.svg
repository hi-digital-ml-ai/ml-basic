<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 490" width="100%" role="img" aria-label="Three intervals from one model. For the average, a confidence interval: narrow, holding few single catches; it narrows as more stations are sampled. For a new catch, a prediction interval: wide, holding most catches; it stays wide however many stations are sampled. From held-out errors, conformal prediction: the errors on calibration sites, sorted, set the width at the point where 90% of them end; it holds 9 catches in 10 at stations like the calibration sites. A note says a prediction interval is checked by its coverage, the share of new catches that fall inside it.">
<defs>
<marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009E73"/></marker>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .ax   { fill: none; stroke: #8a949c; stroke-width: 1.6; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">Three intervals</text>
<rect class="box" x="0" y="48" width="294" height="384" rx="8"/><rect x="0" y="48" width="294" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="22" y="90">For the average</text>
<text class="lab" x="22" y="114" fill="#0072B2">A CONFIDENCE INTERVAL</text>
<text class="body" x="22" y="344">Where the average lies.</text>
<text class="body" x="22" y="368">It narrows as more</text>
<text class="body" x="22" y="392">stations are sampled.</text>
<rect class="box" x="323" y="48" width="294" height="384" rx="8"/><rect x="323" y="48" width="294" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="345" y="90">For a new catch</text>
<text class="lab" x="345" y="114" fill="#E69F00">A PREDICTION INTERVAL</text>
<text class="body" x="345" y="344">Where one new catch may</text>
<text class="body" x="345" y="368">land. It stays wide however</text>
<text class="body" x="345" y="392">many stations are sampled.</text>
<rect class="box" x="646" y="48" width="294" height="384" rx="8"/><rect x="646" y="48" width="294" height="6" rx="3" fill="#009E73"/>
<text class="head" x="668" y="90">From held-out errors</text>
<text class="lab" x="668" y="114" fill="#009E73">CONFORMAL PREDICTION</text>
<text class="body" x="668" y="344">Calibration errors set the</text>
<text class="body" x="668" y="368">width. It holds 9 in 10 at</text>
<text class="body" x="668" y="392">stations like those sites.</text>
