<rect x="324" y="474" width="46" height="28" rx="4" fill="#009E73" fill-opacity="0.15" stroke="#009E73" stroke-width="1.2"/>
<text class="sm" x="347" y="493" text-anchor="middle">0.37</text>
<rect x="376" y="474" width="46" height="28" rx="4" fill="#009E73" fill-opacity="0.15" stroke="#009E73" stroke-width="1.2"/>
<text class="sm" x="399" y="493" text-anchor="middle">0.57</text>
<text class="lab" x="346" y="530" fill="#009E73" text-anchor="middle">THE SAME DRAWS</text>
<rect x="775" y="404" width="140" height="122" rx="4" fill="#ffffff" stroke="#D55E00" stroke-width="1.6"/>
<text class="sm" x="787" y="426" font-weight="bold">package</text>
<text class="sm" x="903" y="426" font-weight="bold" text-anchor="end">version</text>
<line x1="775" y1="436" x2="915" y2="436" stroke="#8a949c" stroke-width="1"/>
<text class="sm" x="787" y="460">A</text>
<text class="sm" x="903" y="460" text-anchor="end">1.2.0</text>
<text class="sm" x="787" y="486">B</text>
<text class="sm" x="903" y="486" text-anchor="end">0.9.4</text>
<text class="sm" x="787" y="512">C</text>
<text class="sm" x="903" y="512" text-anchor="end">3.1.1</text>
<text class="note" x="470" y="582" text-anchor="middle">With all four, anyone can re-run the analysis and get the same numbers.</text>
</svg>
