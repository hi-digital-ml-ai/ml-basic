<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 490" width="100%" role="img" aria-label="A model card in three parts. What the model is: the method, its settings, the data and how they were collected. How well it predicts: its error on sites it never saw, in the outcome's units. Where it holds: the range of the inputs it was fitted to, and the uses it was built for. A note says that a model card travels with the model, so its users know what it can and cannot do.">
<defs>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .ax   { fill: none; stroke: #8a949c; stroke-width: 1.6; }
      .bar  { fill: #dfe5ea; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">A model card</text>

<!-- card 1: what the model is -->
<rect class="box" x="0" y="48" width="294" height="384" rx="8"/><rect x="0" y="48" width="294" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="22" y="90">What the model is</text>
<text class="lab" x="22" y="114" fill="#0072B2">MODEL, DATA AND INPUTS</text>
<rect x="62" y="138" width="170" height="168" rx="5" fill="#ffffff" stroke="#0072B2" stroke-width="1.6"/>
<rect x="62" y="138" width="170" height="24" rx="5" fill="#0072B2" fill-opacity="0.25"/>
<text class="sm" x="76" y="190" font-weight="bold">model</text>
<rect class="bar" x="134" y="179" width="84" height="12" rx="3"/>
<text class="sm" x="76" y="228" font-weight="bold">data</text>
<rect class="bar" x="134" y="217" width="70" height="12" rx="3"/>
<text class="sm" x="76" y="266" font-weight="bold">inputs</text>
<rect class="bar" x="134" y="255" width="78" height="12" rx="3"/>
<text class="body" x="22" y="356">The method, its settings,</text>
<text class="body" x="22" y="380">the data and how they</text>
<text class="body" x="22" y="404">were collected.</text>

<!-- card 2: how well it predicts -->
<rect class="box" x="323" y="48" width="294" height="384" rx="8"/><rect x="323" y="48" width="294" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="345" y="90">How well it predicts</text>
<text class="lab" x="345" y="114" fill="#E69F00">SCORE ON NEW SITES</text>
<text class="sm" x="352" y="146">Count</text>
<line x1="440" y1="141" x2="458" y2="141" stroke="#1f2933" stroke-width="2.6"/>
<text class="sm" x="464" y="146">predicted</text>
<circle cx="536" cy="141" r="5" fill="#0072B2"/>
<text class="sm" x="546" y="146">recorded</text>
<line class="ax" x1="352" y1="156" x2="352" y2="290"/>
<line class="ax" x1="352" y1="290" x2="596" y2="290"/>
<g stroke="#E69F00" stroke-width="3">
<line x1="384" y1="236" x2="384" y2="206"/>
<line x1="424" y1="250" x2="424" y2="262"/>
<line x1="464" y1="196" x2="464" y2="232"/>
<line x1="504" y1="222" x2="504" y2="210"/>
<line x1="544" y1="178" x2="544" y2="204"/>
<line x1="580" y1="246" x2="580" y2="226"/>
</g>
<g stroke="#1f2933" stroke-width="2.6">
<line x1="374" y1="236" x2="394" y2="236"/>
<line x1="414" y1="250" x2="434" y2="250"/>
<line x1="454" y1="196" x2="474" y2="196"/>
<line x1="494" y1="222" x2="514" y2="222"/>
<line x1="534" y1="178" x2="554" y2="178"/>
<line x1="570" y1="246" x2="590" y2="246"/>
</g>
<g fill="#0072B2">
<circle cx="384" cy="206" r="5"/><circle cx="424" cy="262" r="5"/><circle cx="464" cy="232" r="5"/>
<circle cx="504" cy="210" r="5"/><circle cx="544" cy="204" r="5"/><circle cx="580" cy="226" r="5"/>
</g>
<text class="sm" x="474" y="310" text-anchor="middle">stations at held-out sites</text>
<text class="body" x="345" y="356">Its typical miss on sites it</text>
<text class="body" x="345" y="380">never saw, in the outcome's</text>
<text class="body" x="345" y="404">units.</text>

<!-- card 3: where it holds -->
<rect class="box" x="646" y="48" width="294" height="384" rx="8"/><rect x="646" y="48" width="294" height="6" rx="3" fill="#009E73"/>
<text class="head" x="668" y="90">Where it holds</text>
<text class="lab" x="668" y="114" fill="#009E73">RANGE AND INTENDED USE</text>
<rect x="722" y="168" width="142" height="104" rx="4" fill="#009E73" fill-opacity="0.15"/>
<text class="sm" x="793" y="160" text-anchor="middle" style="fill: #009E73">fitted to</text>
<g fill="#009E73" fill-opacity="0.75">
<circle cx="736" cy="250" r="5"/><circle cx="752" cy="230" r="5"/><circle cx="768" cy="244" r="5"/>
<circle cx="784" cy="212" r="5"/><circle cx="800" cy="236" r="5"/><circle cx="814" cy="196" r="5"/>
<circle cx="830" cy="226" r="5"/><circle cx="848" cy="206" r="5"/><circle cx="852" cy="252" r="5"/>
</g>
<text class="sm" x="696" y="226" text-anchor="middle" fill="#55606a">?</text>
<text class="sm" x="892" y="226" text-anchor="middle" fill="#55606a">?</text>
<line class="ax" x1="676" y1="280" x2="910" y2="280"/>
<text class="sm" x="793" y="304" text-anchor="middle">an input, such as temperature</text>
<text class="body" x="668" y="356">The range of the inputs it</text>
<text class="body" x="668" y="380">was fitted to, and the uses</text>
<text class="body" x="668" y="404">it was built for.</text>

<text class="note" x="470" y="464" text-anchor="middle">A model card travels with the model, so its users know what it can and cannot do.</text>
</svg>
