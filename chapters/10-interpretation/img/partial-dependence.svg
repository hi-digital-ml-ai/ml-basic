<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 490" width="100%" role="img" aria-label="Partial dependence in three steps. Set one input: every row gets the same value of it, and the other inputs keep their own. Predict each row: repeated along the input's range, each row traces a curve, its ICE curve. Average: the average of the curves is the partial dependence. A note says that where the rows' curves differ in shape the average hides it, so look at both.">
<defs>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .ax   { fill: none; stroke: #8a949c; stroke-width: 1.6; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">Partial dependence</text>
<rect class="box" x="0" y="48" width="294" height="384" rx="8"/><rect x="0" y="48" width="294" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="22" y="90">Set one input</text>
<text class="lab" x="22" y="114" fill="#0072B2">EVERY ROW GETS ONE VALUE</text>
<text class="body" x="22" y="356">Give every row the same</text>
<text class="body" x="22" y="380">value of one input. The</text>
<text class="body" x="22" y="404">others keep their own.</text>
<rect class="box" x="323" y="48" width="294" height="384" rx="8"/><rect x="323" y="48" width="294" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="345" y="90">Predict each row</text>
<text class="lab" x="345" y="114" fill="#E69F00">ONE ICE CURVE PER ROW</text>
<text class="body" x="345" y="356">Predict, then move the</text>
<text class="body" x="345" y="380">value along its range: each</text>
<text class="body" x="345" y="404">row traces a curve.</text>
<rect class="box" x="646" y="48" width="294" height="384" rx="8"/><rect x="646" y="48" width="294" height="6" rx="3" fill="#009E73"/>
<text class="head" x="668" y="90">Average</text>
<text class="lab" x="668" y="114" fill="#009E73">THE PARTIAL DEPENDENCE</text>
<text class="body" x="668" y="356">The average of the rows&#8217;</text>
<text class="body" x="668" y="380">curves is the partial</text>
<text class="body" x="668" y="404">dependence.</text>
