<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 490" width="100%" role="img" aria-label="Two ways to read a model, and one way to score it. Read the parts of an interpretable model: each input has its own curve or level, and they add up to the prediction. Probe a black box from outside: change its inputs and watch the prediction, as importance and partial dependence do. Score both on the same held-out sites, so the cost of reading is measured. A note says that however a model is read, it shows what the model learned, and the data decide how far that describes the species.">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a949c"/></marker>
<marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E69F00"/></marker>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .big  { font: bold 24px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .ax   { fill: none; stroke: #8a949c; stroke-width: 1.6; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">Reading a model</text>
<rect class="box" x="0" y="48" width="294" height="384" rx="8"/><rect x="0" y="48" width="294" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="22" y="90">Read the parts</text>
<text class="lab" x="22" y="114" fill="#0072B2">AN INTERPRETABLE MODEL</text>
<text class="body" x="22" y="344">Each input has its own</text>
<text class="body" x="22" y="368">curve or level, and they</text>
<text class="body" x="22" y="392">add up to the prediction.</text>
<rect class="box" x="323" y="48" width="294" height="384" rx="8"/><rect x="323" y="48" width="294" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="345" y="90">Probe from outside</text>
<text class="lab" x="345" y="114" fill="#E69F00">A BLACK BOX</text>
<text class="body" x="345" y="344">Change the inputs and</text>
<text class="body" x="345" y="368">watch the prediction, as</text>
<text class="body" x="345" y="392">importance and partial</text>
<text class="body" x="345" y="416">dependence do.</text>
<rect class="box" x="646" y="48" width="294" height="384" rx="8"/><rect x="646" y="48" width="294" height="6" rx="3" fill="#009E73"/>
<text class="head" x="668" y="90">Score both</text>
<text class="lab" x="668" y="114" fill="#009E73">THE SAME HELD-OUT SITES</text>
<text class="body" x="668" y="344">Score both on the same</text>
<text class="body" x="668" y="368">folds, so the cost of</text>
<text class="body" x="668" y="392">reading is measured.</text>
<path class="ax" d="M 22 170 V 250 H 86"/>
<text class="sm" x="54.0" y="270" text-anchor="middle">Input A</text>
<path d="M 26.0 235.7 L 27.4 234.9 L 28.8 233.7 L 30.2 232.2 L 31.6 230.4 L 33.0 228.1 L 34.4 225.3 L 35.8 222.1 L 37.2 218.4 L 38.6 214.4 L 40.0 210.0 L 41.4 205.5 L 42.8 201.0 L 44.2 196.8 L 45.6 192.9 L 47.0 189.6 L 48.4 187.2 L 49.8 185.6 L 51.2 185.1 L 52.6 185.6 L 54.0 187.2 L 55.4 189.6 L 56.8 192.9 L 58.2 196.8 L 59.6 201.0 L 61.0 205.5 L 62.4 210.0 L 63.8 214.4 L 65.2 218.4 L 66.6 222.1 L 68.0 225.3 L 69.4 228.1 L 70.8 230.4 L 72.2 232.2 L 73.6 233.7 L 75.0 234.9 L 76.4 235.7 L 77.8 236.4 L 79.2 236.8 L 80.6 237.2 L 82.0 237.4" fill="none" stroke="#0072B2" stroke-width="3"/>
<text class="big" x="99" y="218" text-anchor="middle">+</text>
<path class="ax" d="M 114 170 V 250 H 178"/>
<text class="sm" x="146.0" y="270" text-anchor="middle">Input B</text>
<path d="M 118.0 191.3 L 119.4 192.2 L 120.8 193.2 L 122.2 194.1 L 123.6 195.0 L 125.0 195.9 L 126.4 196.9 L 127.8 197.8 L 129.2 198.7 L 130.6 199.7 L 132.0 200.6 L 133.4 201.5 L 134.8 202.5 L 136.2 203.4 L 137.6 204.3 L 139.0 205.2 L 140.4 206.2 L 141.8 207.1 L 143.2 208.0 L 144.6 209.0 L 146.0 209.9 L 147.4 210.8 L 148.8 211.8 L 150.2 212.7 L 151.6 213.6 L 153.0 214.6 L 154.4 215.5 L 155.8 216.4 L 157.2 217.3 L 158.6 218.3 L 160.0 219.2 L 161.4 220.1 L 162.8 221.1 L 164.2 222.0 L 165.6 222.9 L 167.0 223.8 L 168.4 224.8 L 169.8 225.7 L 171.2 226.6 L 172.6 227.6 L 174.0 228.5" fill="none" stroke="#0072B2" stroke-width="3"/>
<text class="big" x="191" y="218" text-anchor="middle">+</text>
<path class="ax" d="M 206 170 V 250 H 270"/>
<text class="sm" x="238.0" y="270" text-anchor="middle">Input C</text>
<rect x="214" y="216.1" width="14" height="27.9" fill="#0072B2" fill-opacity="0.75"/>
<rect x="233" y="194.4" width="14" height="49.6" fill="#0072B2" fill-opacity="0.75"/>
<rect x="252" y="225.4" width="14" height="18.6" fill="#0072B2" fill-opacity="0.75"/>
<text class="sm" x="147" y="306" text-anchor="middle" fill="#0072B2">= the prediction</text>
<rect x="423" y="160" width="96" height="120" rx="8" fill="#3d4852"/>
<text class="sm" x="471.0" y="225.0" text-anchor="middle" style="fill: #ffffff">500 trees</text>
<line x1="367" y1="188" x2="419" y2="188" stroke="#E69F00" stroke-width="3" marker-end="url(#arrow-o)"/>
<text class="sm" x="353" y="193" text-anchor="middle">A</text>
<line x1="367" y1="220" x2="419" y2="220" stroke="#8a949c" stroke-width="2" marker-end="url(#arrow)"/>
<text class="sm" x="353" y="225" text-anchor="middle">B</text>
<line x1="367" y1="252" x2="419" y2="252" stroke="#8a949c" stroke-width="2" marker-end="url(#arrow)"/>
<text class="sm" x="353" y="257" text-anchor="middle">C</text>
<text class="sm" x="393" y="172" text-anchor="middle" fill="#E69F00">change</text>
<line x1="523" y1="220.0" x2="569" y2="220.0" stroke="#E69F00" stroke-width="3" marker-end="url(#arrow-o)"/>
<text class="sm" x="549" y="208.0" text-anchor="middle" fill="#E69F00">watch</text>
<rect x="678" y="162" width="19" height="26" rx="3" fill="#c9d3d9"/>
<rect x="701" y="162" width="19" height="26" rx="3" fill="#c9d3d9"/>
<rect x="724" y="162" width="19" height="26" rx="3" fill="#c9d3d9"/>
<rect x="747" y="162" width="19" height="26" rx="3" fill="#009E73"/>
<rect x="770" y="162" width="19" height="26" rx="3" fill="#c9d3d9"/>
<rect x="793" y="162" width="19" height="26" rx="3" fill="#c9d3d9"/>
<rect x="816" y="162" width="19" height="26" rx="3" fill="#c9d3d9"/>
<rect x="839" y="162" width="19" height="26" rx="3" fill="#c9d3d9"/>
<rect x="862" y="162" width="19" height="26" rx="3" fill="#c9d3d9"/>
<rect x="885" y="162" width="19" height="26" rx="3" fill="#c9d3d9"/>
<text class="sm" x="756.5" y="208" text-anchor="middle" fill="#009E73">held-out sites</text>
<text class="sm" x="678" y="253">Interpretable</text>
<rect x="778" y="238" width="120" height="20" rx="3" fill="#009E73" fill-opacity="0.85"/>
<text class="sm" x="678" y="289">Black box</text>
<rect x="778" y="274" width="116" height="20" rx="3" fill="#009E73" fill-opacity="0.55"/>
<text class="sm" x="778" y="320" fill="#55606a">error on new sites</text>
<text class="note" x="470" y="464" text-anchor="middle">However a model is read, it shows what the model learned; the data decide how far that describes the species.</text>
</svg>
