<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 500" width="100%" role="img" aria-label="One training step in three cards. Forward pass: the inputs are pushed through the hidden layer to a prediction, which is compared with the observed value to give the loss; every value is kept. Backward pass: the error is passed back along the same arrows, giving each weight its slope. Step downhill: every weight moves a little way down the loss curve; repeat until the loss stops falling.">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a949c"/></marker>
<marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0072B2"/></marker>
<marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D55E00"/></marker>
<marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009E73"/></marker>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .smi  { font: italic 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">One training step</text>
<rect class="box" x="8" y="48" width="296" height="404" rx="8"/><rect x="8" y="48" width="296" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="26" y="86">Forward pass</text><text class="lab" x="26" y="108" fill="#0072B2">PREDICT</text>
<text class="body" x="26" y="374">Push the inputs through and</text><text class="body" x="26" y="396">keep every value on the way</text>
<text class="note" x="26" y="428">Ends in a prediction and a loss</text>
<rect class="box" x="322" y="48" width="296" height="404" rx="8"/><rect x="322" y="48" width="296" height="6" rx="3" fill="#D55E00"/>
<text class="head" x="340" y="86">Backward pass</text><text class="lab" x="340" y="108" fill="#D55E00">BACKPROPAGATION</text>
<text class="body" x="340" y="374">Pass the error back along the</text><text class="body" x="340" y="396">same arrows to each weight</text>
<text class="note" x="340" y="428">Gives every weight its slope</text>
<rect class="box" x="636" y="48" width="296" height="404" rx="8"/><rect x="636" y="48" width="296" height="6" rx="3" fill="#009E73"/>
<text class="head" x="654" y="86">Step downhill</text><text class="lab" x="654" y="108" fill="#009E73">GRADIENT DESCENT</text>
<text class="body" x="654" y="374">Move every weight a little</text><text class="body" x="654" y="396">way against its slope</text>
<text class="note" x="654" y="428">Repeat until the loss levels off</text>
<g transform="translate(156,128)"><line x1="-110" y1="50" x2="-46" y2="25" stroke="#0072B2" stroke-width="1.6" stroke-opacity="0.75"/><line x1="-110" y1="50" x2="-46" y2="85" stroke="#0072B2" stroke-width="1.6" stroke-opacity="0.75"/><line x1="-110" y1="50" x2="-46" y2="145" stroke="#0072B2" stroke-width="1.6" stroke-opacity="0.75"/><line x1="-110" y1="120" x2="-46" y2="25" stroke="#0072B2" stroke-width="1.6" stroke-opacity="0.75"/><line x1="-110" y1="120" x2="-46" y2="85" stroke="#0072B2" stroke-width="1.6" stroke-opacity="0.75"/><line x1="-110" y1="120" x2="-46" y2="145" stroke="#0072B2" stroke-width="1.6" stroke-opacity="0.75"/><line x1="-46" y1="25" x2="18" y2="85" stroke="#0072B2" stroke-width="1.6" stroke-opacity="0.75"/><line x1="-46" y1="85" x2="18" y2="85" stroke="#0072B2" stroke-width="1.6" stroke-opacity="0.75"/><line x1="-46" y1="145" x2="18" y2="85" stroke="#0072B2" stroke-width="1.6" stroke-opacity="0.75"/><line x1="33" y1="85" x2="56" y2="85" stroke="#0072B2" stroke-width="1.6"/><circle cx="-110" cy="50" r="15" fill="#e8f1f7" stroke="#55606a" stroke-width="1.5"/><text class="sm" x="-110" y="55" text-anchor="middle">x<tspan baseline-shift="sub" font-size="11">1</tspan></text><circle cx="-110" cy="120" r="15" fill="#e8f1f7" stroke="#55606a" stroke-width="1.5"/><text class="sm" x="-110" y="125" text-anchor="middle">x<tspan baseline-shift="sub" font-size="11">2</tspan></text><circle cx="-46" cy="25" r="13" fill="#E69F00" fill-opacity="0.22" stroke="#E69F00" stroke-width="1.5"/><circle cx="-46" cy="85" r="13" fill="#E69F00" fill-opacity="0.22" stroke="#E69F00" stroke-width="1.5"/><circle cx="-46" cy="145" r="13" fill="#E69F00" fill-opacity="0.22" stroke="#E69F00" stroke-width="1.5"/><circle cx="18" cy="85" r="15" fill="#e2f2ec" stroke="#55606a" stroke-width="1.5"/><text class="sm" x="18" y="90" text-anchor="middle">ŷ</text><rect x="56" y="58" width="66" height="54" rx="6" fill="#fff" stroke="#8a949c" stroke-width="1.4"/><text class="sm" x="89" y="81" text-anchor="middle">loss</text><text class="smi" x="89" y="101" text-anchor="middle">ŷ vs y</text><line x1="-110" y1="182" x2="110" y2="182" stroke="#0072B2" stroke-width="2.4" marker-end="url(#arrb)"/><text class="smi" x="0" y="204" text-anchor="middle" style="fill:#0072B2">inputs to loss</text></g>
<g transform="translate(470,128)"><line x1="-110" y1="50" x2="-46" y2="25" stroke="#D55E00" stroke-width="1.6" stroke-opacity="0.75"/><line x1="-110" y1="50" x2="-46" y2="85" stroke="#D55E00" stroke-width="1.6" stroke-opacity="0.75"/><line x1="-110" y1="50" x2="-46" y2="145" stroke="#D55E00" stroke-width="1.6" stroke-opacity="0.75"/><line x1="-110" y1="120" x2="-46" y2="25" stroke="#D55E00" stroke-width="1.6" stroke-opacity="0.75"/><line x1="-110" y1="120" x2="-46" y2="85" stroke="#D55E00" stroke-width="1.6" stroke-opacity="0.75"/><line x1="-110" y1="120" x2="-46" y2="145" stroke="#D55E00" stroke-width="1.6" stroke-opacity="0.75"/><line x1="-46" y1="25" x2="18" y2="85" stroke="#D55E00" stroke-width="1.6" stroke-opacity="0.75"/><line x1="-46" y1="85" x2="18" y2="85" stroke="#D55E00" stroke-width="1.6" stroke-opacity="0.75"/><line x1="-46" y1="145" x2="18" y2="85" stroke="#D55E00" stroke-width="1.6" stroke-opacity="0.75"/><line x1="33" y1="85" x2="56" y2="85" stroke="#D55E00" stroke-width="1.6"/><circle cx="-110" cy="50" r="15" fill="#e8f1f7" stroke="#55606a" stroke-width="1.5"/><text class="sm" x="-110" y="55" text-anchor="middle">x<tspan baseline-shift="sub" font-size="11">1</tspan></text><circle cx="-110" cy="120" r="15" fill="#e8f1f7" stroke="#55606a" stroke-width="1.5"/><text class="sm" x="-110" y="125" text-anchor="middle">x<tspan baseline-shift="sub" font-size="11">2</tspan></text><circle cx="-46" cy="25" r="13" fill="#E69F00" fill-opacity="0.22" stroke="#E69F00" stroke-width="1.5"/><circle cx="-46" cy="85" r="13" fill="#E69F00" fill-opacity="0.22" stroke="#E69F00" stroke-width="1.5"/><circle cx="-46" cy="145" r="13" fill="#E69F00" fill-opacity="0.22" stroke="#E69F00" stroke-width="1.5"/><circle cx="18" cy="85" r="15" fill="#e2f2ec" stroke="#55606a" stroke-width="1.5"/><text class="sm" x="18" y="90" text-anchor="middle">ŷ</text><rect x="56" y="58" width="66" height="54" rx="6" fill="#fff" stroke="#8a949c" stroke-width="1.4"/><text class="sm" x="89" y="81" text-anchor="middle">loss</text><text class="smi" x="89" y="101" text-anchor="middle">ŷ vs y</text><line x1="110" y1="182" x2="-110" y2="182" stroke="#D55E00" stroke-width="2.4" marker-end="url(#arrv)"/><text class="smi" x="0" y="204" text-anchor="middle" style="fill:#D55E00">loss back to weights</text></g>
<g transform="translate(784,128)"><polyline points="-112,18.0 -108,28.4 -104,38.4 -100,48.0 -96,57.3 -92,66.1 -88,74.6 -84,82.7 -80,90.5 -76,97.8 -72,104.8 -68,111.4 -64,117.7 -60,123.5 -56,129.0 -52,134.1 -48,138.8 -44,143.2 -40,147.1 -36,150.7 -32,153.9 -28,156.7 -24,159.2 -20,161.3 -16,163.0 -12,164.3 -8,165.2 -4,165.8 0,166.0 4,165.8 8,165.2 12,164.3 16,163.0 20,161.3 24,159.2 28,156.7 32,153.9 36,150.7 40,147.1 44,143.2 48,138.8 52,134.1 56,129.0 60,123.5 64,117.7 68,111.4 72,104.8 76,97.8 80,90.5 84,82.7 88,74.6 92,66.1 96,57.3 100,48.0 104,38.4 108,28.4 112,18.0" fill="none" stroke="#1f2933" stroke-width="2.4"/><path d="M -87 56.1 Q -65.0 45.1 -49 126.5" fill="none" stroke="#009E73" stroke-width="1.6" marker-end="url(#arrg)"/><path d="M -45 126.5 Q -30.0 122.5 -21 150.3" fill="none" stroke="#009E73" stroke-width="1.6" marker-end="url(#arrg)"/><path d="M -17 150.3 Q -8.0 152.3 -5 155.6" fill="none" stroke="#009E73" stroke-width="1.6" marker-end="url(#arrg)"/><circle cx="-92" cy="66.1" r="6" fill="#009E73" stroke="#fff" stroke-width="1.5"/><circle cx="-50" cy="136.5" r="6" fill="#009E73" stroke="#fff" stroke-width="1.5"/><circle cx="-22" cy="160.3" r="6" fill="#009E73" stroke="#fff" stroke-width="1.5"/><circle cx="-6" cy="165.6" r="6" fill="#009E73" stroke="#fff" stroke-width="1.5"/><text class="smi" x="-98" y="88" text-anchor="end">start</text><line x1="-118" y1="184" x2="118" y2="184" stroke="#8a949c" stroke-width="1.4"/><text class="smi" x="0" y="204" text-anchor="middle">one weight</text><text class="smi" x="124" y="10" text-anchor="end">loss</text></g>
</svg>
