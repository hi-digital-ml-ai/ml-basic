<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 500" width="100%" role="img" aria-label="An autoencoder in three parts. The encoder takes the many columns of a row down to a few values through weighted sums. Those values, the code, place each row as a point on a small map. The decoder rebuilds the row from the code, and the gap between the rebuilt row and the input is the reconstruction error that training makes small.">
<defs><style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .smi  { font: italic 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
    </style></defs>
<text class="title" x="470" y="26" text-anchor="middle">Rebuilding a row through a narrow middle</text>
<rect class="box" x="8" y="48" width="296" height="404" rx="8"/><rect x="8" y="48" width="296" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="26" y="86">1  Encoder</text><text class="lab" x="26" y="108" fill="#0072B2">SQUEEZE</text>
<text class="body" x="26" y="374">Weighted sums take each row</text><text class="body" x="26" y="396">down to a few values</text>
<text class="note" x="26" y="428">Many columns in, two out</text>
<rect class="box" x="322" y="48" width="296" height="404" rx="8"/><rect x="322" y="48" width="296" height="6" rx="3" fill="#009E73"/>
<text class="head" x="340" y="86">2  Code</text><text class="lab" x="340" y="108" fill="#009E73">A FEW VALUES PER ROW</text>
<text class="body" x="340" y="374">The values place each row on</text><text class="body" x="340" y="396">a small map, like PCA's scores</text>
<text class="note" x="340" y="428">Nothing labels the code</text>
<rect class="box" x="636" y="48" width="296" height="404" rx="8"/><rect x="636" y="48" width="296" height="6" rx="3" fill="#D55E00"/>
<text class="head" x="654" y="86">3  Decoder</text><text class="lab" x="654" y="108" fill="#D55E00">REBUILD AND COMPARE</text>
<text class="body" x="654" y="374">Weighted sums rebuild the row;</text><text class="body" x="654" y="396">the gap is reconstruction error</text>
<text class="note" x="654" y="428">Training makes the gap small</text>
