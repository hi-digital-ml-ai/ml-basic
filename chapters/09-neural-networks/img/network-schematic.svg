<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340"
     font-family="Helvetica, Arial, sans-serif" role="img">
  <title>A network with three inputs, one hidden layer of four units, and one output</title>

  <style>
    .lab   { font-size: 13px; fill: #3d4852; }
    .head  { font-size: 13px; fill: #55606a; font-weight: bold; letter-spacing: .04em; }
    .note  { font-size: 11.5px; fill: #77818a; }
    .edge  { stroke: #b9c2c9; stroke-width: 1.1; fill: none; }
    .edge-hi { stroke: #0072B2; stroke-width: 2; fill: none; }
    .node  { stroke: #55606a; stroke-width: 1.3; fill: #ffffff; }
    .node-in  { fill: #e8f1f7; }
    .node-hid { fill: #fdf0dc; }
    .node-out { fill: #e2f2ec; }
    .wlab  { font-size: 11px; fill: #0072B2; }
  </style>

  <text class="head" x="62"  y="26" text-anchor="middle">INPUTS</text>
  <text class="head" x="360" y="26" text-anchor="middle">HIDDEN LAYER</text>
  <text class="head" x="640" y="26" text-anchor="middle">OUTPUT</text>

  <!-- edges: inputs -> hidden -->
  <g class="edge">
    <path d="M86 90  L332 78"/><path d="M86 90  L332 148"/><path d="M86 90  L332 218"/><path d="M86 90  L332 288"/>
    <path d="M86 170 L332 148"/><path d="M86 170 L332 218"/><path d="M86 170 L332 288"/>
    <path d="M86 250 L332 78"/><path d="M86 250 L332 148"/><path d="M86 250 L332 218"/><path d="M86 250 L332 288"/>
  </g>
  <path class="edge-hi" d="M86 170 L332 78"/>

  <!-- edges: hidden -> output -->
  <g class="edge">
    <path d="M388 78  L612 170"/><path d="M388 148 L612 170"/>
    <path d="M388 218 L612 170"/><path d="M388 288 L612 170"/>
  </g>

  <!-- input nodes -->
  <circle class="node node-in" cx="62" cy="90"  r="24"/>
  <circle class="node node-in" cx="62" cy="170" r="24"/>
  <circle class="node node-in" cx="62" cy="250" r="24"/>
  <text class="lab" x="62" y="95"  text-anchor="middle">depth</text>
  <text class="lab" x="62" y="175" text-anchor="middle">temp</text>
  <text class="lab" x="62" y="255" text-anchor="middle">chl</text>

  <!-- hidden nodes -->
  <circle class="node node-hid" cx="360" cy="78"  r="28"/>
  <circle class="node node-hid" cx="360" cy="148" r="28"/>
  <circle class="node node-hid" cx="360" cy="218" r="28"/>
  <circle class="node node-hid" cx="360" cy="288" r="28"/>
  <text class="lab" x="360" y="83"  text-anchor="middle">h₁</text>
  <text class="lab" x="360" y="153" text-anchor="middle">h₂</text>
  <text class="lab" x="360" y="223" text-anchor="middle">h₃</text>
  <text class="lab" x="360" y="293" text-anchor="middle">h₄</text>

  <!-- output node -->
  <circle class="node node-out" cx="640" cy="170" r="28"/>
  <text class="lab" x="640" y="175" text-anchor="middle">ŷ</text>

  <!-- highlighted weight -->
  <text class="wlab" x="198" y="112">w₂₁</text>

  <!-- annotation of one unit -->
  <text class="note" x="360" y="332" text-anchor="middle">
    each hidden unit computes  h = g(w₁·depth + w₂·temp + w₃·chl + b)
  </text>
  <text class="note" x="640" y="214" text-anchor="middle">ŷ = v·h + c</text>
</svg>
