<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 500" width="100%" role="img" aria-label="Three cards. One neuron: inputs x1 to x3, each multiplied by a weight, summed with a bias and passed through an activation g to give the output. A hidden layer: three inputs, four hidden units and one output, every input joined to every hidden unit and every hidden unit to the output. Bends add up to curves: a rising S-curve and a falling S-curve, added together, make a hump.">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a949c"/></marker>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .smi  { font: italic 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .ln   { fill: none; stroke: #8a949c; stroke-width: 1.8; }
      .edge { fill: none; stroke: #8a949c; stroke-width: 1.3; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">From one neuron to a network</text>
<rect class="box" x="8" y="48" width="296" height="404" rx="8"/><rect x="8" y="48" width="296" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="26" y="86">One neuron</text><text class="lab" x="26" y="108" fill="#0072B2">A REGRESSION</text>
<text class="body" x="26" y="374">A weighted sum of the inputs</text><text class="body" x="26" y="396">plus a bias, through a bend</text>
<text class="note" x="26" y="428">No bend: linear regression</text>
<rect class="box" x="322" y="48" width="296" height="404" rx="8"/><rect x="322" y="48" width="296" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="340" y="86">A hidden layer</text><text class="lab" x="340" y="108" fill="#D55E00">SEVERAL NEURONS</text>
<text class="body" x="340" y="374">Several neurons read the same</text><text class="body" x="340" y="396">inputs; the output adds them up</text>
<text class="note" x="340" y="428">Every arrow is a weight to fit</text>
<rect class="box" x="636" y="48" width="296" height="404" rx="8"/><rect x="636" y="48" width="296" height="6" rx="3" fill="#009E73"/>
<text class="head" x="654" y="86">Bends add up to curves</text><text class="lab" x="654" y="108" fill="#009E73">THE ACTIVATION</text>
<text class="body" x="654" y="374">Opposing bends add up to a</text><text class="body" x="654" y="396">shape no straight line can follow</text>
<text class="note" x="654" y="428">Without the bend, still a line</text>
