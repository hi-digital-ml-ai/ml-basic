<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 500" width="100%" role="img" aria-label="Learning curves in three cards. A learning curve: error on new data falls as training rows are added and levels off above the noise. Two models: a flexible model starts with higher error than a simple one but falls further and overtakes it. Noise: with low noise the curves cross after few rows; with high noise they cross only after more rows than the survey has.">
<defs><style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .smi  { font: italic 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
    </style></defs>
<text class="title" x="470" y="26" text-anchor="middle">Learning curves</text>
<rect class="box" x="8" y="48" width="296" height="404" rx="8"/><rect x="8" y="48" width="296" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="26" y="86">Learning curve</text><text class="lab" x="26" y="108" fill="#0072B2">ERROR AGAINST ROWS</text>
<text class="body" x="26" y="374">Error on new data falls as</text><text class="body" x="26" y="396">training rows are added</text>
<text class="note" x="26" y="428">It levels off above the noise</text>
<rect class="box" x="322" y="48" width="296" height="404" rx="8"/><rect x="322" y="48" width="296" height="6" rx="3" fill="#D55E00"/>
<text class="head" x="340" y="86">Two models</text><text class="lab" x="340" y="108" fill="#D55E00">SIMPLE AND FLEXIBLE</text>
<text class="body" x="340" y="374">A flexible model needs more</text><text class="body" x="340" y="396">rows to overtake a simple one</text>
<text class="note" x="340" y="428">Before that, the simple one wins</text>
<rect class="box" x="636" y="48" width="296" height="404" rx="8"/><rect x="636" y="48" width="296" height="6" rx="3" fill="#009E73"/>
<text class="head" x="654" y="86">Noise</text><text class="lab" x="654" y="108" fill="#009E73">SIGNAL AGAINST NOISE</text>
<text class="body" x="654" y="374">Noisier data push the crossing</text><text class="body" x="654" y="396">towards more rows</text>
<text class="note" x="654" y="428">Judge rows relative to noise</text>
