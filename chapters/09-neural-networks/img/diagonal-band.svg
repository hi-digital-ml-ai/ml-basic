<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 500" width="100%" role="img" aria-label="Three ways to draw the boundary of a diagonal band of one class, in temperature against salinity. A linear model draws one straight line and can only say which side a point is on. A decision tree cuts one input at a time, so the diagonal band becomes a staircase of rectangles. A network's hidden units each bend along a tilted line, and two opposing bends leave the band between them.">
<defs><style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .smi  { font: italic 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
    </style></defs>
<text class="title" x="470" y="26" text-anchor="middle">Drawing a diagonal band</text>
<rect class="box" x="8" y="48" width="296" height="404" rx="8"/><rect x="8" y="48" width="296" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="26" y="86">Linear model</text><text class="lab" x="26" y="108" fill="#0072B2">ONE STRAIGHT LINE</text>
<text class="body" x="26" y="374">One weighted sum of the inputs</text><text class="body" x="26" y="396">draws one straight boundary</text>
<text class="note" x="26" y="428">It cannot fence in a band</text>
<rect class="box" x="322" y="48" width="296" height="404" rx="8"/><rect x="322" y="48" width="296" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="340" y="86">Decision tree</text><text class="lab" x="340" y="108" fill="#b57d00">ONE INPUT AT A TIME</text>
<text class="body" x="340" y="374">Each split cuts one input, so</text><text class="body" x="340" y="396">a diagonal edge becomes steps</text>
<text class="note" x="340" y="428">Smoothing the steps takes rows</text>
<rect class="box" x="636" y="48" width="296" height="404" rx="8"/><rect x="636" y="48" width="296" height="6" rx="3" fill="#009E73"/>
<text class="head" x="654" y="86">Network</text><text class="lab" x="654" y="108" fill="#009E73">TILTED BENDS</text>
<text class="body" x="654" y="374">Each hidden unit bends along</text><text class="body" x="654" y="396">a tilted line; two make a band</text>
<text class="note" x="654" y="428">The weights find the tilt</text>
<g transform="translate(156,128)"><polygon points="-104.0,176.5 118.0,49.8 118.0,4.0 -104.0,4.0 -104.0,176.5" fill="#0072B2" fill-opacity="0.16"/><line x1="-104.0" y1="176.5" x2="118.0" y2="49.8" stroke="#0072B2" stroke-width="2.6"/><line x1="-104" y1="180" x2="118" y2="180" stroke="#8a949c" stroke-width="1.4"/><line x1="-104" y1="4" x2="-104" y2="180" stroke="#8a949c" stroke-width="1.4"/><text class="smi" x="7.0" y="202" text-anchor="middle">temperature</text><text class="smi" transform="translate(-114,92.0) rotate(-90)" text-anchor="middle">salinity</text><circle cx="26.8" cy="124.5" r="3.6" fill="#fff" stroke="#8a949c" stroke-width="1.4"/><circle cx="-27.4" cy="60.9" r="3.6" fill="#fff" stroke="#8a949c" stroke-width="1.4"/><circle cx="107.6" cy="156.3" r="3.6" fill="#fff" stroke="#8a949c" stroke-width="1.4"/><circle cx="104.5" cy="15.9" r="3.6" fill="#fff" stroke="#8a949c" stroke-width="1.4"/><circle cx="-45.3" cy="119.0" r="4" fill="#1f2933"/><circle cx="-25.2" cy="47.6" r="3.6" fill="#fff" stroke="#8a949c" stroke-width="1.4"/><circle cx="89.6" cy="45.1" r="4" fill="#1f2933"/><circle cx="-90.4" cy="171.4" r="3.6" fill="#fff" stroke="#8a949c" stroke-width="1.4"/><circle cx="-6.7" cy="56.1" r="3.6" fill="#fff" stroke="#8a949c" stroke-width="1.4"/><circle cx="24.2" cy="136.1" r="3.6" fill="#fff" stroke="#8a949c" stroke-width="1.4"/><circle cx="-93.5" cy="81.7" r="3.6" fill="#fff" stroke="#8a949c" stroke-width="1.4"/><circle cx="-63.5" cy="26.4" r="3.6" fill="#fff" stroke="#8a949c" stroke-width="1.4"/><circle cx="17.5" cy="100.7" r="4" fill="#1f2933"/><circle cx="102.1" cy="82.7" r="3.6" fill="#fff" stroke="#8a949c" stroke-width="1.4"/><circle cx="69.9" cy="98.3" r="3.6" fill="#fff" stroke="#8a949c" stroke-width="1.4"/><circle cx="-8.0" cy="109.2" r="4" fill="#1f2933"/><circle cx="72.0" cy="150.8" r="3.6" fill="#fff" stroke="#8a949c" stroke-width="1.4"/><circle cx="75.3" cy="54.0" r="4" fill="#1f2933"/><circle cx="34.2" cy="156.0" r="3.6" fill="#fff" stroke="#8a949c