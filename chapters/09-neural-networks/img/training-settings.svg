    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">Three training settings</text>
<rect class="box" x="8" y="48" width="296" height="404" rx="8"/><rect x="8" y="48" width="296" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="26" y="86">Learning rate</text><text class="lab" x="26" y="108" fill="#0072B2">STEP SIZE</text>
<text class="body" x="26" y="374">Too small crawls; too large</text><text class="body" x="26" y="396">overshoots the valley floor</text>
<text class="note" x="26" y="428">Try values a few times apart</text>
<rect class="box" x="322" y="48" width="296" height="404" rx="8"/><rect x="322" y="48" width="296" height="6" rx="3" fill="#D55E00"/>
<text class="head" x="340" y="86">When to stop</text><text class="lab" x="340" y="108" fill="#D55E00">EARLY STOPPING</text>
<text class="body" x="340" y="374">Keep the weights where</text><text class="body" x="340" y="396">validation error is lowest</text>
<text class="note" x="340" y="428">Training error keeps falling</text>
<rect class="box" x="636" y="48" width="296" height="404" rx="8"/><rect x="636" y="48" width="296" height="6" rx="3" fill="#009E73"/>
<text class="head" x="654" y="86">Random start</text><text class="lab" x="654" y="108" fill="#009E73">THE SEED</text>
<text class="body" x="654" y="374">Different starting weights end</text><text class="body" x="654" y="396">in different valleys</text>
<text class="note" x="654" y="428">Fit several; report the spread</text>
