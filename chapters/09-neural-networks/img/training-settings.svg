<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 500" width="100%" role="img" aria-label="Three training settings in three cards. Learning rate: short steps settle at the bottom of the loss curve, long steps jump from side to side. When to stop: training error falls all the way, validation error falls then rises; keep the weights where validation error is lowest. Random start: two starting points on a wavy loss curve roll into different valleys.">
<defs>
<marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0072B2"/></marker>
