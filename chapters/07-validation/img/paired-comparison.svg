<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 566" width="100%" role="img" aria-label="Comparing in pairs removes what both models share. Two cards. Left, scored alone, the intervals overlap: five resamples, each with the error of model A, a blue dot, and of model B, an orange dot, joined by a short line. From one resample to the next both errors move together, between 3.4 and 5.3, and B is always a little lower. Below, model A's interval runs from 3.6 to 5.3 and model B's from 3.4 to 5.0, so the two overlap almost entirely. Right, in pairs, the difference is clear: the same five resamples give one green dot each, the error of B minus the error of A, between minus 0.4 and minus 0.2, all to the left of a dashed line at zero. Its interval is short and clear of zero. A note says a hard resample is hard for both models, so their errors rise and fall together; their difference cancels what they share, so it is far more certain than either error.">
<defs>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; fill: #55606a; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">Comparing in pairs removes what both models share</text>
<rect class="box" x="0" y="56" width="450" height="400" rx="8"/><rect x="0" y="56" width="450" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="22" y="96">Scored alone, the intervals overlap</text>
<line x1="130" y1="144" x2="420" y2="144" stroke="#d5dde2" stroke-width="1"/>
<line x1="130" y1="180" x2="420" y2="180" stroke="#d5dde2" stroke-width="1"/>
<line x1="130" y1="216" x2="420" y2="216" stroke="#d5dde2" stroke-width="1"/>
<line x1="130" y1="252" x2="420" y2="252" stroke="#d5dde2" stroke-width="1"/>
<line x1="130" y1="288" x2="420" y2="288" stroke="#d5dde2" stroke-width="1"/>
<text class="lab" x="114" y="149" text-anchor="end">RESAMPLE 1</text>
<text class="lab" x="114" y="185" text-anchor="end">RESAMPLE 2</text>
<text class="lab" x="114" y="221" text-anchor="end">RESAMPLE 3</text>
<text class="lab" x="114" y="257" text-anchor="end">RESAMPLE 4</text>
<text class="lab" x="114" y="293" text-anchor="end">RESAMPLE 5</text>
<line x1="207.3" y1="144" x2="236.3" y2="144" stroke="#8a949c" stroke-width="2"/><circle cx="236.3" cy="144" r="7" fill="#0072B2" stroke="#ffffff" stroke-width="1.2"/><circle cx="207.3" cy="144" r="7" fill="#E69F00" stroke="#ffffff" stroke-width="1.2"/>
<line x1="323.3" y1="180" x2="352.3" y2="180" stroke="#8a949c" stroke-width="2"/><circle cx="352.3" cy="180" r="7" fill="#0072B2" stroke="#ffffff" stroke-width="1.2"/><circle cx="323.3" cy="180" r="7" fill="#E69F00" stroke="#ffffff" stroke-width="1.2"/>
<line x1="168.7" y1="216" x2="188.0" y2="216" stroke="#8a949c" stroke-width="2"/><circle cx="188.0" cy="216" r="7" fill="#0072B2" stroke="#ffffff" stroke-width="1.2"/><circle cx="168.7" cy="216" r="7" fill="#E69F00" stroke="#ffffff" stroke-width="1.2"/>
<line x1="255.7" y1="252" x2="294.3" y2="252" stroke="#8a949c" stroke-width="2"/><circle cx="294.3" cy="252" r="7" fill="#0072B2" stroke="#ffffff" stroke-width="1.2"/><circle cx="255.7" cy="252" r="7" fill="#E69F00" stroke="#ffffff" stroke-width="1.2"/>
<line x1="299.2" y1="288" x2="323.3" y2="288" stroke="#8a949c" stroke-width="2"/><circle cx="323.3" cy="288" r="7" fill="#0072B2" stroke="#ffffff" stroke-width="1.2"/><circle cx="299.2" cy="288" r="7" fill="#E69F00" stroke="#ffffff" stroke-width="1.2"/>
<text class="lab" x="114" y="345" text-anchor="end">MODEL A</text><line x1="188.0" y1="340" x2="352.3" y2="340" stroke="#0072B2" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
<text class="lab" x="114" y="377" text-anchor="end">MODEL B</text><line x1="168.7" y1="372" x2="323.3" y2="372" stroke="#E69F00" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
<line x1="130" y1="396" x2="420" y2="396" stroke="#8a949c" stroke-width="1.4"/>
<line x1="130.0" y1="396" x2="130.0" y2="402" stroke="#8a949c" stroke-width="1.4"/><text class="sm" x="130.0" y="420" text-anchor="middle">3</text>
<line x1="226.7" y1="396" x2="226.7" y2="402" stroke="#8a949c" stroke-width="1.4"/><text class="sm" x="226.7" y="420" text-anchor="middle">4</text>
<line x1="323.3" y1="396" x2="323.3" y2="402" stroke="#8a949c" stroke-width="1.4"/><text class="sm" x="323.3" y="420" text-anchor="middle">5</text>
<line x1="420.0" y1="396" x2="420.0" y2="402" stroke="#8a949c" stroke-width="1.4"/><text class="sm" x="420.0" y="420" text-anchor="middle">6</text>
<text class="lab" x="275.0" y="442" text-anchor="middle">ERROR</text>
<rect class="box" x="510" y="56" width="450" height="400" rx="8"/><rect x="510" y="56" width="450" height="6" rx="3" fill="#009E73"/>
<text class="head" x="532" y="96">In pairs, the difference is clear</text>
<line x1="640" y1="144" x2="930" y2="144" stroke="#d5dde2" stroke-width="1"/>
<line x1="640" y1="180" x2="930" y2="180" stroke="#d5dde2" stroke-width="1"/>
<line x1="640" y1="216" x2="930" y2="216" stroke="#d5dde2" stroke-width="1"/>
<line x1="640" y1="252" x2="930" y2="252" stroke="#d5dde2" stroke-width="1"/>
<line x1="640" y1="288" x2="930" y2="288" stroke="#d5dde2" stroke-width="1"/>
<text class="lab" x="624" y="149" text-anchor="end">RESAMPLE 1</text>
<text class="lab" x="624" y="185" text-anchor="end">RESAMPLE 2</text>
<text class="lab" x="624" y="221" text-anchor="end">RESAMPLE 3</text>
<text class="lab" x="624" y="257" text-anchor="end">RESAMPLE 4</text>
<text class="lab" x="624" y="293" text-anchor="end">RESAMPLE 5</text>
<line x1="785.0" y1="122" x2="785.0" y2="396" stroke="#8a949c" stroke-width="1.4" stroke-dasharray="5 4"/>
<circle cx="712.5" cy="144" r="7" fill="#009E73" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="712.5" cy="180" r="7" fill="#009E73" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="736.7" cy="216" r="7" fill="#009E73" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="688.3" cy="252" r="7" fill="#009E73" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="724.6" cy="288" r="7" fill="#009E73" stroke="#ffffff" stroke-width="1.2"/>
<text class="lab" x="624" y="345" text-anchor="end">B − A</text><line x1="688.3" y1="340" x2="736.7" y2="340" stroke="#009E73" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
<text class="body" x="797.0" y="346">clear of zero</text>
<line x1="640" y1="396" x2="930" y2="396" stroke="#8a949c" stroke-width="1.4"/>
<line x1="664.2" y1="396" x2="664.2" y2="402" stroke="#8a949c" stroke-width="1.4"/><text class="sm" x="664.2" y="420" text-anchor="middle">−0.5</text>
<line x1="785.0" y1="396" x2="785.0" y2="402" stroke="#8a949c" stroke-width="1.4"/><text class="sm" x="785.0" y="420" text-anchor="middle">0</text>
<line x1="905.8" y1="396" x2="905.8" y2="402" stroke="#8a949c" stroke-width="1.4"/><text class="sm" x="905.8" y="420" text-anchor="middle">0.5</text>
<text class="lab" x="785.0" y="442" text-anchor="middle">ERROR OF B − ERROR OF A</text>
<text class="note" x="470" y="498" text-anchor="middle">A hard resample is hard for both models, so their errors rise and fall together.</text>
<text class="note" x="470" y="524" text-anchor="middle">Their difference cancels what they share, so it is far more certain than either error.</text>
</svg>
