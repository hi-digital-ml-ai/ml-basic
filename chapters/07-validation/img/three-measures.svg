<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 476" width="100%" role="img" aria-label="Three cards show the same twenty cases in two rows: four truly yes, drawn filled, and sixteen truly no, drawn open. A dashed box marks the six the model called yes: three true yeses and three noes. One true yes lies outside the box. Sensitivity, lowered by misses: of the four true yeses, three were called yes and one, the miss, was not; 3 of 4. Specificity, lowered by false alarms: of the sixteen true noes, thirteen were called no and three, the false alarms, sit in the box; 13 of 16. Precision, lowered by false alarms: of the six yes calls, three are true and three are false alarms; 3 of 6. A note says accuracy, 16 of 20, hides the miss, because when yeses are few it mostly counts the noes.">
<defs>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
