<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 556" width="100%" role="img" aria-label="The cheaper call sets the threshold. Left, a false alarm costs 3 misses. At a probability of presence of 0.6, calling present expects 3 times 0.4, 1.2, and calling absent 0.6, so it is called absent. At 0.9, calling present expects 0.3 and absent 0.9, so it is called present. Right, the threshold k over 1 plus k on a probability scale: 0.50 for k of 1, 0.75 for k of 3 and 0.83 for k of 5, with everything above it called present.">
<defs>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; fill: #55606a; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .win  { font: bold 16px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #009E73; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">The cheaper call sets the threshold</text>
<rect class="box" x="0" y="56" width="450" height="404" rx="8"/><rect x="0" y="56" width="450" height="6" rx="3" fill="#D55E00"/>
<text class="head" x="22" y="96">Weigh the two calls</text>
<text class="body" x="22" y="126">A false alarm costs 3 misses.</text>
<text class="lab" x="22" y="172">PROBABILITY OF PRESENCE 0.6</text>
<text class="body" x="22" y="204">call present</text><rect x="140" y="188" width="168.0" height="20" rx="3" fill="#D55E00" opacity="0.85"/><text class="sm" x="316.0" y="204">3 × 0.4 = 1.2</text>
<text class="body" x="22" y="234">call absent</text><rect x="140" y="218" width="84.0" height="20" rx="3" fill="#0072B2" opacity="0.85"/><text class="sm" x="232.0" y="234">0.6</text>
<text class="win" x="22" y="270">Cheaper: call it absent</text>
<text class="lab" x="22" y="312">PROBABILITY OF PRESENCE 0.9</text>
<text class="body" x="22" y="344">call present</text><rect x="140" y="328" width="42.0" height="20" rx="3" fill="#D55E00" opacity="0.85"/><text class="sm" x="190.0" y="344">3 × 0.1 = 0.3</text>
<text class="body" x="22" y="374">call absent</text><rect x="140" y="358" width="126.0" height="20" rx="3" fill="#0072B2" opacity="0.85"/><text class="sm" x="274.0" y="374">0.9</text>
<text class="win" x="22" y="410">Cheaper: call it present</text>
<rect class="box" x="490" y="56" width="450" height="404" rx="8"/><rect x="490" y="56" width="450" height="6" rx="3" fill="#009E73"/>
<text class="head" x="512" y="96">The threshold is k / (1 + k)</text>
<text class="body" x="512" y="126">A false alarm costs k misses.</text>
<text class="body" x="512" y="200">k = 1</text><rect x="582" y="184" width="330" height="22" fill="#ffffff" stroke="#8a949c" stroke-width="1.2"/><rect x="747.0" y="184" width="165.0" height="22" fill="#009E73" opacity="0.8"/><line x1="747.0" y1="178" x2="747.0" y2="212" stroke="#1f2933" stroke-width="1.6"/><text class="sm" x="747.0" y="174" text-anchor="middle">0.50</text>
<text class="body" x="512" y="262">k = 3</text><rect x="582" y="246" width="330" height="22" fill="#ffffff" stroke="#8a949c" stroke-width="1.2"/><rect x="829.5" y="246" width="82.5" height="22" fill="#009E73" opacity="0.8"/><line x1="829.5" y1="240" x2="829.5" y2="274" stroke="#1f2933" stroke-width="1.6"/><text class="sm" x="829.5" y="236" text-anchor="middle">0.75</text>
<text class="body" x="512" y="324">k = 5</text><rect x="582" y="308" width="330" height="22" fill="#ffffff" stroke="#8a949c" stroke-width="1.2"/><rect x="857.0" y="308" width="55.0" height="22" fill="#009E73" opacity="0.8"/><line x1="857.0" y1="302" x2="857.0" y2="336" stroke="#1f2933" stroke-width="1.6"/><text class="sm" x="857.0" y="298" text-anchor="middle">0.83</text>
<line x1="582" y1="356" x2="912" y2="356" stroke="#8a949c" stroke-width="1.4"/>
<line x1="582" y1="356" x2="582" y2="362" stroke="#8a949c" stroke-width="1.4"/><text class="sm" x="582" y="380" text-anchor="middle">0</text>
<line x1="747.0" y1="356" x2="747.0" y2="362" stroke="#8a949c" stroke-width="1.4"/><text class="sm" x="747.0" y="380" text-anchor="middle">0.5</text>
<line x1="912" y1="356" x2="912" y2="362" stroke="#8a949c" stroke-width="1.4"/><text class="sm" x="912" y="380" text-anchor="middle">1</text>
<text class="lab" x="747.0" y="402" text-anchor="middle">PROBABILITY OF PRESENCE</text>
<rect x="512" y="420" width="22" height="16" fill="#009E73" opacity="0.8"/><text class="sm" x="542" y="434">called present</text>
<text class="note" x="470" y="496" text-anchor="middle">Calling present expects k × (1 − p); calling absent expects p. Present is cheaper above k / (1 + k).</text>
<text class="note" x="470" y="522" text-anchor="middle">The rule holds when the probabilities are calibrated: a 0.8 means 8 in 10.</text>
</svg>