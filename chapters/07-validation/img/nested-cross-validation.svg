<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 660" width="100%" role="img" aria-label="Nested cross-validation in five outer rounds. In outer round 1 the first of five folds of sites is held out, and the other four are handed to the search. The search cuts those four folds again into inner folds; in each inner round one inner fold is held out, and every candidate model is scored on it. The candidate with the lowest inner error is chosen, fitted to all four folds, and used once to predict the outer fold. Below, three steps: repeat for each of the five outer folds; pool the outer folds' predictions into one score; that score is the search's, choice included. A note says the outer fold plays no part in the choice, so its error is not flattered by it.">
