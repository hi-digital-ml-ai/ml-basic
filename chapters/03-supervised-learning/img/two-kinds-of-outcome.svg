<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 474" width="100%" role="img" aria-label="Two kinds of outcome. Regression predicts a quantity, such as a temperature, a weight or a count: a prediction of 11 when the truth is 12 is nearly right, one of 20 is far off, and the error is measured in the outcome's units. Classification predicts a category, such as present or absent, a species or a seabed type: the model gives a probability for each category, here sand 0.6, mud 0.3 and rock 0.1, and each answer is right or wrong.">
<defs>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .ln   { fill: none; stroke: #8a949c; stroke-width: 1.8; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">Two kinds of outcome</text>

<!-- Regression -->
<rect class="box" x="0" y="48" width="450" height="330" rx="8"/><rect x="0" y="48" width="450" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="22" y="90">Regression</text>
<text class="lab" x="22" y="114" fill="#0072B2">PREDICTS A QUANTITY</text>
<text class="body" x="22" y="146">A temperature, a weight, a count</text>
<line class="ln" x1="40" y1="222" x2="410" y2="222"/>
<g stroke="#8a949c" stroke-width="1.4"><line x1="40" y1="216" x2="40" y2="228"/><line x1="114" y1="216" x2="114" y2="228"/><line x1="188" y1="216" x2="188" y2="228"/><line x1="262" y1="216" x2="262" y2="228"/><line x1="336" y1="216" x2="336" y2="228"/><line x1="410" y1="216" x2="410" y2="228"/></g>
<line x1="217.6" y1="194" x2="217.6" y2="222" stroke="#1f2933" stroke-width="2.4"/>
<text class="sm" x="217.6" y="186" text-anchor="middle">truth: 12</text>
<circle cx="202.8" cy="222" r="7" fill="#009E73"/>
<circle cx="336" cy="222" r="7" fill="#D55E00"/>
<text class="sm" x="202.8" y="254" text-anchor="end">11, nearly right</text>
<text class="sm" x="336" y="254" text-anchor="middle">20, far off</text>
<text class="body" x="22" y="300">A near miss is nearly right, so the error</text>
<text class="body" x="22" y="324">is measured as a distance, in the</text>
<text class="body" x="22" y="348">outcome's own units.</text>

<!-- Classification -->
<rect class="box" x="490" y="48" width="450" height="330" rx="8"/><rect x="490" y="48" width="450" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="512" y="90">Classification</text>
<text class="lab" x="512" y="114" fill="#D55E00">PREDICTS A CATEGORY</text>
<text class="body" x="512" y="146">Present or absent, a species, a seabed type</text>
<text class="sm" x="520" y="191">sand</text><rect x="572" y="177" width="168" height="18" rx="3" fill="#E69F00"/><text class="sm" x="748" y="191">0.6</text>
<text class="sm" x="520" y="219">mud</text><rect x="572" y="205" width="84" height="18" rx="3" fill="#E69F00" fill-opacity="0.55"/><text class="sm" x="664" y="219">0.3</text>
<text class="sm" x="520" y="247">rock</text><rect x="572" y="233" width="28" height="18" rx="3" fill="#E69F00" fill-opacity="0.55"/><text class="sm" x="608" y="247">0.1</text>
<text class="body" x="512" y="300">The model gives each category a probability.</text>
<text class="body" x="512" y="324">Its answer is right or wrong; the</text>
<text class="body" x="512" y="348">probability shows how sure it was.</text>

<text class="note" x="470" y="420" text-anchor="middle">Many marine outcomes need more care than either box suggests: counts, percentages, ordered classes.</text>
</svg>
