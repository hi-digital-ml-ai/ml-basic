<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 500" width="100%" role="img" aria-label="A model built for yes or no. Log-odds: a straight line, log-odds equals a plus b times the input; the weighted sum can take any value, as a straight line does. Probability, squeezed between 0 and 1: p equals 1 over 1 plus e to the minus log-odds; an S-shaped curve rises from near 0 to near 1, with the observed no answers along the bottom and yes answers along the top; the curve nears 0 and 1 but never crosses them. Answer, a threshold you choose: yes if p is at least the threshold; a dashed line at 0.5 cuts the curve, inputs to its left are called no and to its right yes; raising the threshold gives fewer false alarms but more misses. A note says a probability stays between 0 and 1, and turning it into yes or no is a separate choice.">
<defs>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .eq   { font: italic 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .ax   { fill: none; stroke: #8a949c; stroke-width: 1.6; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">A model built for yes or no</text>
<rect class="box" x="0" y="48" width="294" height="362" rx="8"/><rect x="0" y="48" width="294" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="22" y="90">Log-odds</text>
<text class="lab" x="22" y="114" fill="#0072B2">A STRAIGHT LINE</text>
<text class="eq" x="22" y="146">log-odds = a + b × input</text>
<path class="ax" d="M34 168 V295 H266"/>
<text class="sm" x="266" y="315" text-anchor="end">input</text>
<text class="sm" x="26" y="231.5" text-anchor="middle" transform="rotate(-90 26 231.5)" dy="-4">log-odds</text>
<text class="body" x="22" y="348">The weighted sum can take</text>
<text class="body" x="22" y="372">any value, as a straight</text>
<text class="body" x="22" y="396">line does.</text>
<line x1="34" y1="231.5" x2="266" y2="231.5" stroke="#8a949c" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="sm" x="262" y="225" text-anchor="end">0</text>
<path d="M44 288 L258 176" stroke="#0072B2" stroke-width="3"/>
<rect class="box" x="323" y="48" width="294" height="362" rx="8"/><rect x="323" y="48" width="294" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="345" y="90">Probability</text>
<text class="lab" x="345" y="114" fill="#D55E00">SQUEEZED BETWEEN 0 AND 1</text>
<text class="eq" x="345" y="146">p = 1 / (1 + e<tspan dy="-8" font-size="14">−log-odds</tspan><tspan dy="8">)</tspan></text>
<path class="ax" d="M357 168 V295 H589"/>
<text class="sm" x="589" y="315" text-anchor="end">input</text>
<text class="sm" x="349" y="231.5" text-anchor="middle" transform="rotate(-90 349 231.5)" dy="-4">probability</text>
<text class="body" x="345" y="348">The S-shaped curve nears</text>
<text class="body" x="345" y="372">0 and 1 but never crosses</text>
<text class="body" x="345" y="396">them.</text>
<line x1="357" y1="192" x2="589" y2="192" stroke="#8a949c" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="sm" x="371" y="186" text-anchor="end">1</text>
<line x1="357" y1="272" x2="589" y2="272" stroke="#8a949c" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="sm" x="371" y="289" text-anchor="end">0</text>
<circle cx="381.0" cy="281" r="3.6" fill="#E69F00" fill-opacity="0.7"/><circle cx="396.5" cy="281" r="3.6" fill="#E69F00" fill-opacity="0.7"/><circle cx="412.0" cy="281" r="3.6" fill="#E69F00" fill-opacity="0.7"/><circle cx="427.5" cy="281" r="3.6" fill="#E69F00" fill-opacity="0.7"/><circle cx="443.0" cy="183" r="3.6" fill="#E69F00" fill-opacity="0.7"/><circle cx="458.5" cy="281" r="3.6" fill="#E69F00" fill-opacity="0.7"/><circle cx="474.0" cy="281" r="3.6" fill="#E69F00" fill-opacity="0.7"/><circle cx="489.5" cy="281" r="3.6" fill="#E69F00" fill-opacity="0.7"/><circle cx="505.0" cy="183" r="3.6" fill="#E69F00" fill-opacity="0.7"/><circle cx="520.5" cy="183" r="3.6" fill="#E69F00" fill-opacity="0.7"/><circle cx="536.0" cy="183" r="3.6" fill="#E69F00" fill-opacity="0.7"/><circle cx="551.5" cy="183" r="3.6" fill="#E69F00" fill-opacity="0.7"/><circle cx="567.0" cy="183" r="3.6" fill="#E69F00" fill-opacity="0.7"/><circle cx="582.5" cy="183" r="3.6" fill="#E69F00" fill-opacity="0.7"/>
<path d="M365.0 271.4 L370.4 271.3 L375.8 271.0 L381.2 270.8 L386.6 270.5 L392.0 270.0 L397.4 269.5 L402.8 268.8 L408.2 268.0 L413.6 267.0 L419.0 265.7 L424.4 264.1 L429.8 262.2 L435.2 259.8 L440.6 257.1 L446.0 253.9 L451.4 250.2 L456.8 246.1 L462.2 241.6 L467.6 236.9 L473.0 232.0 L478.4 227.1 L483.8 222.4 L489.2 217.9 L494.6 213.8 L500.0 210.1 L505.4 206.9 L510.8 204.2 L516.2 201.8 L521.6 199.9 L527.0 198.3 L532.4 197.0 L537.8 196.0 L543.2 195.2 L548.6 194.5 L554.0 194.0 L559.4 193.5 L564.8 193.2 L570.2 193.0 L575.6 192.7 L581.0 192.6" fill="none" stroke="#D55E00" stroke-width="3"/>
<rect class="box" x="646" y="48" width="294" height="362" rx="8"/><rect x="646" y="48" width="294" height="6" rx="3" fill="#009E73"/>
<text class="head" x="668" y="90">Answer</text>
<text class="lab" x="668" y="114" fill="#009E73">A THRESHOLD YOU CHOOSE</text>
<text class="eq" x="668" y="146">yes if p ≥ threshold</text>
<path class="ax" d="M680 168 V295 H912"/>
<text class="sm" x="912" y="315" text-anchor="end">input</text>
<text class="sm" x="672" y="231.5" text-anchor="middle" transform="rotate(-90 672 231.5)" dy="-4">probability</text>
<text class="body" x="668" y="348">Raising the threshold gives</text>
<text class="body" x="668" y="372">fewer false alarms but</text>
<text class="body" x="668" y="396">more misses.</text>
<rect x="681" y="168" width="115" height="118" fill="#8a949c" fill-opacity="0.10"/>
<rect x="796" y="168" width="116" height="118" fill="#009E73" fill-opacity="0.12"/>
<line x1="680" y1="237.0" x2="912" y2="237.0" stroke="#D55E00" stroke-width="1.8" stroke-dasharray="6 4"/>
<text class="sm" x="908" y="231.0" text-anchor="end" fill="#D55E00">0.5</text>
<line x1="796" y1="168" x2="796" y2="295" stroke="#55606a" stroke-width="1.2" stroke-dasharray="2 3"/>
<text class="sm" x="738.5" y="188" text-anchor="middle">called no</text>
<text class="sm" x="854.0" y="188" text-anchor="middle">called yes</text>
<path d="M688.0 271.5 L693.4 271.3 L698.8 271.2 L704.2 270.9 L709.6 270.6 L715.0 270.3 L720.4 269.8 L725.8 269.2 L731.2 268.5 L736.6 267.6 L742.0 266.5 L747.4 265.1 L752.8 263.4 L758.2 261.4 L763.6 258.9 L769.0 256.1 L774.4 252.9 L779.8 249.3 L785.2 245.4 L790.6 241.3 L796.0 237.0 L801.4 232.7 L806.8 228.6 L812.2 224.7 L817.6 221.1 L823.0 217.9 L828.4 215.1 L833.8 212.6 L839.2 210.6 L844.6 208.9 L850.0 207.5 L855.4 206.4 L860.8 205.5 L866.2 204.8 L871.6 204.2 L877.0 203.7 L882.4 203.4 L887.8 203.1 L893.2 202.8 L898.6 202.7 L904.0 202.5" fill="none" stroke="#009E73" stroke-width="3"/>
<text class="note" x="470" y="452" text-anchor="middle">A probability stays between 0 and 1; turning it into yes or no is a separate choice.</text>
</svg>
