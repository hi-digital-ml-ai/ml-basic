<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 500" width="100%" role="img" aria-label="From a straight line to a curve. A straight line, a plus b times the input, has one slope: each extra unit of the input adds the same amount wherever you start. A curve adds a squared input, a plus b times the input plus c times the input squared; it has one peak, the optimum, and is still linear regression, a weighted sum of columns, one of them a square. Beyond the data the curve keeps going: past the range of the data it keeps falling, even below zero.">
<defs>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .eq   { font: italic 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .ax   { fill: none; stroke: #8a949c; stroke-width: 1.6; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">From a straight line to a curve</text>
<rect class="box" x="0" y="48" width="294" height="362" rx="8"/><rect x="0" y="48" width="294" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="22" y="90">Straight line</text>
<text class="lab" x="22" y="114" fill="#0072B2">ONE SLOPE</text>
<text class="eq" x="22" y="146">a + b × input</text>
<path class="ax" d="M34 168 V295 H266"/>
<text class="sm" x="266" y="315" text-anchor="end">input</text>
<text class="sm" x="26" y="231.5" text-anchor="middle" transform="rotate(-90 26 231.5)" dy="-4">outcome</text>
<circle cx="46.0" cy="275.4" r="3.6" fill="#0072B2" fill-opacity="0.55"/><circle cx="65.0" cy="272.1" r="3.6" fill="#0072B2" fill-opacity="0.55"/><circle cx="84.0" cy="253.9" r="3.6" fill="#0072B2" fill-opacity="0.55"/><circle cx="103.0" cy="254.9" r="3.6" fill="#0072B2" fill-opacity="0.55"/><circle cx="122.0" cy="253.2" r="3.6" fill="#0072B2" fill-opacity="0.55"/><circle cx="141.0" cy="239.6" r="3.6" fill="#0072B2" fill-opacity="0.55"/><circle cx="160.0" cy="244.3" r="3.6" fill="#0072B2" fill-opacity="0.55"/><circle cx="179.0" cy="209.4" r="3.6" fill="#0072B2" fill-opacity="0.55"/><circle cx="198.0" cy="211.9" r="3.6" fill="#0072B2" fill-opacity="0.55"/><circle cx="217.0" cy="195.4" r="3.6" fill="#0072B2" fill-opacity="0.55"/><circle cx="236.0" cy="186.5" r="3.6" fill="#0072B2" fill-opacity="0.55"/><circle cx="255.0" cy="185.2" r="3.6" fill="#0072B2" fill-opacity="0.55"/>
<line x1="42" y1="276.6" x2="258" y2="185.9" stroke="#0072B2" stroke-width="3"/>
<text class="body" x="22" y="348">Each extra unit of the input</text>
<text class="body" x="22" y="372">adds the same amount,</text>
<text class="body" x="22" y="396">wherever you start.</text>
<rect class="box" x="323" y="48" width="294" height="362" rx="8"/><rect x="323" y="48" width="294" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="345" y="90">Curve</text>
<text class="lab" x="345" y="114" fill="#D55E00">ADD A SQUARED INPUT</text>
<text class="eq" x="345" y="146">a + b × input + c × input²</text>
<path class="ax" d="M357 168 V295 H589"/>
<text class="sm" x="589" y="315" text-anchor="end">input</text>
<text class="sm" x="349" y="231.5" text-anchor="middle" transform="rotate(-90 349 231.5)" dy="-4">outcome</text>
<circle cx="369.0" cy="259.3" r="3.6" fill="#E69F00" fill-opacity="0.55"/><circle cx="388.0" cy="239.0" r="3.6" fill="#E69F00" fill-opacity="0.55"/><circle cx="407.0" cy="222.1" r="3.6" fill="#E69F00" fill-opacity="0.55"/><circle cx="426.0" cy="226.0" r="3.6" fill="#E69F00" fill-opacity="0.55"/><circle cx="445.0" cy="203.5" r="3.6" fill="#E69F00" fill-opacity="0.55"/><circle cx="464.0" cy="174.6" r="3.6" fill="#E69F00" fill-opacity="0.55"/><circle cx="483.0" cy="192.7" r="3.6" fill="#E69F00" fill-opacity="0.55"/><circle cx="502.0" cy="189.0" r="3.6" fill="#E69F00" fill-opacity="0.55"/><circle cx="521.0" cy="199.1" r="3.6" fill="#E69F00" fill-opacity="0.55"/><circle cx="540.0" cy="230.9" r="3.6" fill="#E69F00" fill-opacity="0.55"/><circle cx="559.0" cy="233.6" r="3.6" fill="#E69F00" fill-opacity="0.55"/><circle cx="578.0" cy="238.8" r="3.6" fill="#E69F00" fill-opacity="0.55"/>
<line x1="473.0" y1="190" x2="473.0" y2="295" stroke="#8a949c" stroke-width="1.4" stroke-dasharray="5 4"/>
<path d="M365.0 262.3 L370.4 255.3 L375.8 248.6 L381.2 242.2 L386.6 236.3 L392.0 230.7 L397.4 225.4 L402.8 220.6 L408.2 216.0 L413.6 211.9 L419.0 208.1 L424.4 204.6 L429.8 201.6 L435.2 198.9 L440.6 196.5 L446.0 194.5 L451.4 192.9 L456.8 191.6 L462.2 190.7 L467.6 190.2 L473.0 190.0 L478.4 190.2 L483.8 190.7 L489.2 191.6 L494.6 192.9 L500.0 194.5 L505.4 196.5 L510.8 198.9 L516.2 201.6 L521.6 204.6 L527.0 208.1 L532.4 211.9 L537.8 216.0 L543.2 220.6 L548.6 225.4 L554.0 230.7 L559.4 236.3 L564.8 242.2 L570.2 248.6 L575.6 255.3 L581.0 262.3" fill="none" stroke="#D55E00" stroke-width="3"/>
<text class="sm" x="481.0" y="287">optimum</text>
<text class="body" x="345" y="348">Still linear regression: a</text>
<text class="body" x="345" y="372">weighted sum of columns,</text>
<text class="body" x="345" y="396">one of them a square.</text>
<rect class="box" x="646" y="48" width="294" height="362" rx="8"/><rect x="646" y="48" width="294" height="6" rx="3" fill="#D55E00"/>
<text class="head" x="668" y="90">Beyond the data</text>
<text class="lab" x="668" y="114" fill="#D55E00">THE CURVE KEEPS GOING</text>
<text class="eq" x="668" y="146">No data, no check</text>
<path class="ax" d="M680 168 V295 H912"/>
<text class="sm" x="912" y="315" text-anchor="end">input</text>
<text class="sm" x="672" y="231.5" text-anchor="middle" transform="rotate(-90 672 231.5)" dy="-4">outcome</text>
<rect x="734.0" y="168" width="124.0" height="127" fill="#8a949c" fill-opacity="0.14"/>
<text class="sm" x="796.0" y="184" text-anchor="middle" fill="#55606a">data</text>
<line x1="680" y1="248" x2="912" y2="248" stroke="#8a949c" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="sm" x="912" y="242" text-anchor="end">zero</text>
<path d="M734.0 226.8 L738.1 223.1 L742.3 219.7 L746.4 216.5 L750.5 213.5 L754.7 210.8 L758.8 208.4 L762.9 206.2 L767.1 204.3 L771.2 202.6 L775.3 201.2 L779.5 200.1 L783.6 199.2 L787.7 198.5 L791.9 198.1 L796.0 198.0 L800.1 198.1 L804.3 198.5 L808.4 199.2 L812.5 200.1 L816.7 201.2 L820.8 202.6 L824.9 204.3 L829.1 206.2 L833.2 208.4 L837.3 210.8 L841.5 213.5 L845.6 216.5 L849.7 219.7 L853.9 223.1 L858.0 226.8" fill="none" stroke="#D55E00" stroke-width="3"/>
<path d="M734.0 226.8 L732.5 228.3 L730.9 229.8 L729.4 231.3 L727.9 232.8 L726.3 234.4 L724.8 236.0 L723.3 237.7 L721.7 239.4 L720.2 241.1 L718.7 242.9 L717.1 244.6 L715.6 246.5 L714.1 248.3 L712.5 250.3 L711.0 252.2 L709.5 254.2 L707.9 256.2 L706.4 258.2 L704.9 260.3 L703.3 262.4 L701.8 264.6 L700.3 266.7 L698.7 269.0 L697.2 271.2 L695.7 273.5 L694.1 275.8 L692.6 278.2 L691.1 280.6 L689.5 283.0 L688.0 285.5" fill="none" stroke="#D55E00" stroke-width="3" stroke-dasharray="7 5"/>
<path d="M858.0 226.8 L859.5 228.3 L861.1 229.8 L862.6 231.3 L864.1 232.8 L865.7 234.4 L867.2 236.0 L868.7 237.7 L870.3 239.4 L871.8 241.1 L873.3 242.9 L874.9 244.6 L876.4 246.5 L877.9 248.3 L879.5 250.3 L881.0 252.2 L882.5 254.2 L884.1 256.2 L885.6 258.2 L887.1 260.3 L888.7 262.4 L890.2 264.6 L891.7 266.7 L893.3 269.0 L894.8 271.2 L896.3 273.5 L897.9 275.8 L899.4 278.2 L900.9 280.6 L902.5 283.0 L904.0 285.5" fill="none" stroke="#D55E00" stroke-width="3" stroke-dasharray="7 5"/>
<text class="body" x="668" y="348">Past the data the curve</text>
<text class="body" x="668" y="372">keeps falling, even below</text>
<text class="body" x="668" y="396">zero.</text>
<text class="note" x="470" y="452" text-anchor="middle">A curve can follow a peak that a straight line misses, but only inside the range of the data.</text>
</svg>
