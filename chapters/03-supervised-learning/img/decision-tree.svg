<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 500" width="100%" role="img" aria-label="A model made of questions. Questions, a tree of yes-or-no questions: the first asks whether input 1 is below 6; if yes, a leaf predicts 2.1; if no, a second question asks whether input 2 is below 10, with leaves predicting 5.2 and 2.6. Each leaf predicts the average of the examples that reach it. Boxes, the questions cut up the inputs: a square of input 1 against input 2 is cut by a vertical line at 6, and its right part by a horizontal line at 10, giving three boxes labelled 2.1, 5.2 and 2.6. Every example in a box gets the same prediction. Steps, flat beyond the data: the prediction against one input is a staircase, low, then high, then middle, and it stays level in the shaded regions beyond the data at either end. A note says a deeper tree asks more questions and fits its training data more closely, noise included.">
<defs>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .q    { font: 16px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .leaf { font: bold 16px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #ffffff; }
      .ax   { fill: none; stroke: #8a949c; stroke-width: 1.6; }
      .edge { fill: none; stroke: #8a949c; stroke-width: 1.6; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">A model made of questions</text>
<rect class="box" x="0" y="48" width="294" height="362" rx="8"/><rect x="0" y="48" width="294" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="22" y="90">Questions</text>
<text class="lab" x="22" y="114" fill="#0072B2">A TREE OF YES-OR-NO QUESTIONS</text>
<text class="body" x="22" y="348">Each leaf predicts the</text>
<text class="body" x="22" y="372">average of the examples</text>
<text class="body" x="22" y="396">that reach it.</text>
