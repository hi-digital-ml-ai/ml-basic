<rect x="488.0" y="241" width="48" height="26" rx="13" fill="#ffffff" stroke="#E69F00" stroke-width="1.6"/>
<text class="q" x="512.0" y="259.5" text-anchor="middle" font-weight="bold">5.2</text>
<rect x="488.0" y="169" width="48" height="26" rx="13" fill="#ffffff" stroke="#E69F00" stroke-width="1.6"/>
<text class="q" x="512.0" y="187.5" text-anchor="middle" font-weight="bold">2.6</text>
<rect class="box" x="646" y="48" width="294" height="362" rx="8"/><rect x="646" y="48" width="294" height="6" rx="3" fill="#009E73"/>
<text class="head" x="668" y="90">Steps</text>
<text class="lab" x="668" y="114" fill="#009E73">FLAT BEYOND THE DATA</text>
<text class="body" x="668" y="348">The prediction jumps at</text>
<text class="body" x="668" y="372">each split and stays level</text>
<text class="body" x="668" y="396">past the last one.</text>
