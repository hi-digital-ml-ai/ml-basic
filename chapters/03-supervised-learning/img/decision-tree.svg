<line x1="435" y1="150" x2="435" y2="295" stroke="#D55E00" stroke-width="2"/>
<line x1="435" y1="214" x2="589" y2="214" stroke="#D55E00" stroke-width="2"/>
<text class="sm" x="435" y="143" text-anchor="middle" fill="#D55E00">6</text>
<text class="sm" x="595" y="219" fill="#D55E00">10</text>
<rect x="372.5" y="209" width="48" height="26" rx="13" fill="#ffffff" stroke="#E69F00" stroke-width="1.6"/>
