<text class="sm" x="81.0" y="200.5" text-anchor="end" fill="#55606a">yes</text>
<path class="edge" d="M120 176 L190 210"/>
<text class="sm" x="165.0" y="193.0" text-anchor="start" fill="#55606a">no</text>
<path class="edge" d="M190 242 L138 283"/>
<text class="sm" x="154.0" y="262.5" text-anchor="end" fill="#55606a">yes</text>
<path class="edge" d="M190 242 L244 283"/>
<text class="sm" x="227.0" y="262.5" text-anchor="start" fill="#55606a">no</text>
<rect x="52.0" y="144" width="136" height="32" rx="6" fill="#ffffff" stroke="#1b6a87" stroke-width="1.4"/>
<text class="q" x="120" y="165.5" text-anchor="middle">input 1 &lt; 6 ?</text>
<rect x="122.0" y="210" width="136" height="32" rx="6" fill="#ffffff" stroke="#1b6a87" stroke-width="1.4"/>
<text class="q" x="190" y="231.5" text-anchor="middle">input 2 &lt; 10 ?</text>
<rect x="36" y="225" width="52" height="30" rx="15" fill="#0072B2"/>
<text class="leaf" x="62" y="245.5" text-anchor="middle">2.1</text>
<rect x="112" y="283" width="52" height="30" rx="15" fill="#0072B2"/>
<text class="leaf" x="138" y="303.5" text-anchor="middle">5.2</text>
<rect x="218" y="283" width="52" height="30" rx="15" fill="#0072B2"/>
<text class="leaf" x="244" y="303.5" text-anchor="middle">2.6</text>
<rect class="box" x="323" y="48" width="294" height="362" rx="8"/><rect x="323" y="48" width="294" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="345" y="90">Boxes</text>
<text class="lab" x="345" y="114" fill="#E69F00">THE QUESTIONS CUT THE INPUTS</text>
<text class="body" x="345" y="348">Every example in a box</text>
<text class="body" x="345" y="372">gets the same prediction.</text>
