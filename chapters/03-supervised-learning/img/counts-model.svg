<rect x="692" y="172" width="14" height="10" fill="#E69F00" fill-opacity="0.35"/><text class="sm" x="712" y="182">Poisson</text>
<rect x="692" y="192" width="14" height="10" fill="#009E73" fill-opacity="0.16"/><text class="sm" x="712" y="202">negative binomial</text>
<text class="body" x="668" y="348">Counts of animals that</text>
<text class="body" x="668" y="372">gather in groups vary more</text>
