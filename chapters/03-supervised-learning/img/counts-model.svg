<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 500" width="100%" role="img" aria-label="A model built for counts. Linear regression models the count itself, a plus b times the input, and a straight line keeps falling, even below zero. Poisson regression is a straight line in the log of the count, so the count is e to the power a plus b times the input: each unit multiplies the count, so the curve nears zero but never crosses it. The negative binomial keeps the same curve with a wider spread: counts of animals that gather in groups vary more than Poisson expects. A note says a count never falls below zero, and its spread grows with its size.">
<defs>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .eq   { font: italic 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .ax   { fill: none; stroke: #8a949c; stroke-width: 1.6; }
    </style>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">A model built for counts</text>
<rect class="box" x="0" y="48" width="294" height="362" rx="8"/><rect x="0" y="48" width="294" height="6" rx="3" fill="#0072B2"/>
<text class="head" x="22" y="90">Linear regression</text>
<text class="lab" x="22" y="114" fill="#0072B2">THE COUNT ITSELF</text>
<text class="eq" x="22" y="146">count = a + b × input</text>
<path class="ax" d="M34 168 V295 H266"/>
<text class="sm" x="266" y="315" text-anchor="end">input</text>
<text class="sm" x="26" y="231.5" text-anchor="middle" transform="rotate(-90 26 231.5)" dy="-4">count</text>
<line x1="34" y1="262" x2="266" y2="262" stroke="#8a949c" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="sm" x="40" y="279">zero</text>
<circle cx="46.0" cy="198.5" r="3.6" fill="#0072B2" fill-opacity="0.55"/><circle cx="65.0" cy="219.7" r="3.6" fill="#0072B2" fill-opacity="0.55"/><circle cx="84.0" cy="224.0" r="3.6" fill="#0072B2" fill-opacity="0.55"/><circle cx="103.0" cy="240.5" r="3.6" fill="#0072B2" fill-opacity="0.55"/><circle cx="122.0" cy="252.3" r="3.6" fill="#0072B2" fill-opacity="0.55"/><circle cx="141.0" cy="252.6" r="3.6" fill="#0072B2" fill-opacity="0.55"/><circle cx="160.0" cy="262.0" r="3.6" fill="#0072B2" fill-opacity="0.55"/><circle cx="179.0" cy="247.1" r="3.6" fill="#0072B2" fill-opacity="0.55"/><circle cx="198.0" cy="257.5" r="3.6" fill="#0072B2" fill-opacity="0.55"/><circle cx="217.0" cy="252.0" r="3.6" fill="#0072B2" fill-opacity="0.55"/><circle cx="236.0" cy="252.3" r="3.6" fill="#0072B2" fill-opacity="0.55"/><circle cx="255.0" cy="258.4" r="3.6" fill="#0072B2" fill-opacity="0.55"/>
<path d="M42.0 195.0 L258.0 277.1" stroke="#0072B2" stroke-width="3"/>
<text class="body" x="22" y="348">A straight line in the count</text>
<text class="body" x="22" y="372">keeps falling, even below</text>
<text class="body" x="22" y="396">zero.</text>
<rect class="box" x="323" y="48" width="294" height="362" rx="8"/><rect x="323" y="48" width="294" height="6" rx="3" fill="#E69F00"/>
<text class="head" x="345" y="90">Poisson regression</text>
<text class="lab" x="345" y="114" fill="#D55E00">A STRAIGHT LINE IN THE LOG</text>
<text class="eq" x="345" y="146">count = e<tspan dy="-8" font-size="14">a + b × input</tspan></text>
<path class="ax" d="M357 168 V295 H589"/>
<text class="sm" x="589" y="315" text-anchor="end">input</text>
<text class="sm" x="349" y="231.5" text-anchor="middle" transform="rotate(-90 349 231.5)" dy="-4">count</text>
<line x1="357" y1="262" x2="589" y2="262" stroke="#8a949c" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="sm" x="589" y="279" text-anchor="end">zero</text>
<circle cx="369.0" cy="200.1" r="3.6" fill="#E69F00" fill-opacity="0.55"/><circle cx="388.0" cy="219.2" r="3.6" fill="#E69F00" fill-opacity="0.55"/><circle cx="407.0" cy="232.7" r="3.6" fill="#E69F00" fill-opacity="0.55"/><circle cx="426.0" cy="257.4" r="3.6" fill="#E69F00" fill-opacity="0.55"/><circle cx="445.0" cy="251.8" r="3.6" fill="#E69F00" fill-opacity="0.55"/><circle cx="464.0" cy="234.5" r="3.6" fill="#E69F00" fill-opacity="0.55"/><circle cx="483.0" cy="254.3" r="3.6" fill="#E69F00" fill-opacity="0.55"/><circle cx="502.0" cy="249.4" r="3.6" fill="#E69F00" fill-opacity="0.55"/><circle cx="521.0" cy="252.3" r="3.6" fill="#E69F00" fill-opacity="0.55"/><circle cx="540.0" cy="262.0" r="3.6" fill="#E69F00" fill-opacity="0.55"/><circle cx="559.0" cy="257.3" r="3.6" fill="#E69F00" fill-opacity="0.55"/><circle cx="578.0" cy="242.5" r="3.6" fill="#E69F00" fill-opacity="0.55"/>
<path d="M365.0 193.7 L370.4 199.6 L375.8 205.0 L381.2 209.9 L386.6 214.4 L392.0 218.5 L397.4 222.2 L402.8 225.6 L408.2 228.8 L413.6 231.6 L419.0 234.2 L424.4 236.6 L429.8 238.8 L435.2 240.8 L440.6 242.6 L446.0 244.3 L451.4 245.8 L456.8 247.2 L462.2 248.5 L467.6 249.7 L473.0 250.7 L478.4 251.7 L483.8 252.6 L489.2 253.4 L494.6 254.1 L500.0 254.8 L505.4 255.4 L510.8 256.0 L516.2 256.5 L521.6 257.0 L527.0 257.4 L532.4 257.8 L537.8 258.2 L543.2 258.5 L548.6 258.8 L554.0 259.1 L559.4 259.3 L564.8 259.6 L570.2 259.8 L575.6 260.0 L581.0 260.1" fill="none" stroke="#D55E00" stroke-width="3"/>
<text class="body" x="345" y="348">Each unit multiplies the</text>
<text class="body" x="345" y="372">count, so the curve nears</text>
<text class="body" x="345" y="396">zero but never crosses it.</text>
<rect class="box" x="646" y="48" width="294" height="362" rx="8"/><rect x="646" y="48" width="294" height="6" rx="3" fill="#009E73"/>
<text class="head" x="668" y="90">Negative binomial</text>
<text class="lab" x="668" y="114" fill="#009E73">ROOM FOR EXTRA SPREAD</text>
<text class="eq" x="668" y="146">same curve, wider spread</text>
<path class="ax" d="M680 168 V295 H912"/>
<text class="sm" x="912" y="315" text-anchor="end">input</text>
<text class="sm" x="672" y="231.5" text-anchor="middle" transform="rotate(-90 672 231.5)" dy="-4">count</text>
