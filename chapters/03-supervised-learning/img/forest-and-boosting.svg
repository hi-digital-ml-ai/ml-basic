<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 500" width="100%" role="img" aria-label="Two ways to combine trees. One tree changes with its sample: three staircase predictions from trees fitted to slightly different samples of the same data step up at different places. A few different examples can change the first question and everything below it. Forest, average many trees: many faint staircases and their average, a thick line that rises more gradually. Each tree sees a resample of the examples and a few random inputs at each question. Boosting, small trees in sequence: three small trees in a row, each arrow labelled errors, and the prediction is the sum of all the trees, each scaled down. Each small tree fits what the trees before it got wrong. A note says adding trees to a forest stops helping but does no harm; boosting starts to overfit, so its number of trees is chosen on held-back data.">
<defs>
<style>
      .box  { fill: #f4f8fa; stroke: #1b6a87; stroke-width: 1.6; }
      .title{ font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .head { font: bold 22px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .body { font: 18px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #3d4852; }
      .lab  { font: bold 14px "Source Sans Pro", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .note { font: italic 17px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #55606a; }
      .sm   { font: 15px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .q    { font: 16px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .leaf { font: bold 16px "Source Sans Pro", Helvetica, Arial, sans-serif; fill: #ffffff; }
      .ax   { fill: none; stroke: #8a949c; stroke-width: 1.6; }
      .edge { fill: none; stroke: #8a949c; stroke-width: 1.6; }
    </style>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8a949c"/></marker>
</defs>
<text class="title" x="470" y="26" text-anchor="middle">Two ways to combine trees</text>
