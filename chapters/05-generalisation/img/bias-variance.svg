<text class="head" x="22" y="506">Error at a new station = bias² + variance + noise</text>
<text class="body" x="22" y="568">Rigid model</text>
<rect x="170" y="542" width="190" height="38" fill="#0072B2" opacity="0.85"/>
<text class="lab" x="265.0" y="567" text-anchor="middle" fill="#ffffff">BIAS²</text>
