<text class="body" x="20" y="380">Fitted to six surveys, the lines</text>
<text class="body" x="20" y="402">agree, and all miss the hump.</text>
<text class="body" x="350" y="380">Fitted to six surveys, the curves</text>
<text class="body" x="350" y="402">follow the hump but disagree.</text>
<text class="body" x="680" y="380">Counts at the same spot vary</text>
<text class="body" x="680" y="402">around the expected count.</text>
