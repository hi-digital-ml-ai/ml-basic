<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 772" width="100%" role="img" aria-label="Three small panels, each with a dashed hump-shaped curve for the expected count and a dotted mark at one station. Rigid model, high bias and low variance: six straight lines fitted to six surveys lie close together, and all miss the top of the hump; a bracket marked bias spans the gap between the curve and the lines. Flexible model, low bias and high variance: six wavy curves follow the hump but spread apart; a bracket marked variance spans their spread. Noise, the same for every model: dots for counts at one station scatter above and below the curve; a bracket marked noise spans them. Below, a wide panel says the error at a new station is bias squared plus variance plus noise, and shows two stacked bars. The rigid model's bar is mostly bias with a little variance; the flexible model's bar is mostly variance with a little bias. Both end in a noise segment of the same length. More flexibility trades bias for variance, and the noise stays the same. A note says bias and variance belong to the model, and the noise belongs to the counts.">
