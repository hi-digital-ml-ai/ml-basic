<rect x="474" y="604" width="330" height="38" fill="#6b7680" opacity="0.45"/>
<text class="lab" x="639.0" y="629" text-anchor="middle" fill="#ffffff">NOISE</text>
<text class="sm" x="170" y="672">More flexibility trades bias for variance. The noise stays the same, whatever the model.</text>
<text class="note" x="470" y="728" text-anchor="middle">Bias and variance belong to the model; the noise belongs to the counts.</text>
