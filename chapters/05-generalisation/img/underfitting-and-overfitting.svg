<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 810" width="100%" role="img" aria-label="Three small panels show the same eleven points with a hump-shaped pattern. Too rigid, underfitting: a straight line that misses the hump. In between: a smooth curve that follows the hump. Too flexible, overfitting: a zigzag through every point. Below, a wide panel plots two errors against flexibility. The training error falls steadily to zero. The error on new data falls a little, reaches its lowest point, then rises. On the left, the underfitting zone, both errors are high and close together. On the right, the overfitting zone, the training error is low and the error on new data high, with a wide gap between them. A note says the training error keeps falling as the model bends, and only the error on new data shows where it has gone too far.">
