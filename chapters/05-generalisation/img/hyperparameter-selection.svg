<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -24 1020 668" width="100%" role="img" aria-label="A card shows the training sites cut into five folds, each fold a block of four sites. In five rounds, a different fold is held out and scored as new sites while the model is fitted to the other four, giving errors one to five. The five errors are averaged to give the setting's cross-validated error. Below, four steps: repeat for every candidate setting; choose the setting with the lowest average; refit it on all the training sites; score the test sites once, at the end. A note says each fold holds whole sites, so no site is fitted to and scored in the same round.">
